<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>VFX Workspace — Scene Companion</title>
<link rel="stylesheet" href="ui/theme.css">
<script src="ui/theme.js"></script>
<script src="ui/longpress.js" defer></script>
<script src="ui/feel.js"></script>
<style>
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font:600 14px/1.3 var(--font); touch-action:manipulation; -webkit-user-select:none; user-select:none; overscroll-behavior:none; }
  body { display:flex; flex-direction:column; }
  #stage { flex:0 0 40vh; min-height:200px; position:relative; }
  .thead { display:flex; align-items:center; gap:10px; margin:2px 0 10px; } .thead h1 { margin:0; font-size:18px; font-weight:900; }
  .thead .back { text-decoration:none; color:var(--text); background:var(--raised); border:1px solid var(--line); border-radius:var(--r-md); padding:8px 10px; font-weight:800; }
  #panel .row:has(input[type=range]) { background:var(--field); border-radius:var(--r-md); padding:2px 10px; }
  #stage canvas { position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  #panel { flex:1 1 55%; overflow:auto; padding:10px 14px calc(14px + env(safe-area-inset-bottom)); background:var(--panel-solid); }
  @media (orientation: landscape) { body { flex-direction:row; } #stage { flex:1 1 auto; } #panel { flex:0 0 340px; } }
  .row { display:flex; align-items:center; gap:8px; margin:6px 0; }
  .row label { width:92px; color:var(--dim); font-weight:600; }
  .row input[type=range] { flex:1; }
  .row output { width:52px; text-align:right; color:#9ff4ff; font-variant-numeric:tabular-nums; }
  select, input[type=text], button { font:inherit; border-radius:var(--r-sm); padding:8px 10px; }
  button { background:var(--accent); color:var(--on-accent); border-color:var(--accent); font-weight:800; }
  button.ghost { background:var(--raised); color:var(--text); border-color:var(--line); }
  #msg { color:#9ff4ff; min-height:1.3em; }
  h1 { font-size:16px; margin:4px 0 8px; }
  a { color:#9ff4ff; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body class="ui mode-edit">
<div id="stage"></div>
<div id="panel">
  <div class="thead"><a href="./index.html" class="ib side back" data-icon="edit" title="Back to the editor">Editor</a><h1>VFX workspace</h1></div>
  <div class="row"><label>Start from</label><select id="base"></select><button class="ghost" id="burst">Burst</button></div>
  <div class="row"><label>Repeat</label><input type="range" id="every" min="0" max="3" step="0.1" value="0.8"><output id="everyOut"></output></div>
  <div id="fields"></div>
  <div class="row"><label>Colour</label><input type="color" id="c0"><input type="color" id="c1"><label class="toggle" style="width:auto"><input type="checkbox" id="add"><span></span> glow</label></div>
  <div class="row"><label>Name</label><input type="text" id="name" placeholder="my_sparks" style="flex:1"></div>
  <div class="row"><button id="save" class="primary ib side" data-icon="save" title="Writes it into the effects library (needs npm run dev)">Save to library</button><button class="ghost ib side" id="copy" data-icon="copy">Copy JSON</button></div>
  <div id="msg"></div>
</div>
<script type="module">
import * as THREE from 'three';
import { iconize } from './ui/icons.js';
iconize(document);
import { FX } from './runtime/fxpresets.js';
import { createParticles } from './runtime/particles.js';
import { PRESET_FIELDS, cleanPreset } from './runtime/fxedit.js';
const $ = id => document.getElementById(id);
// lock page zoom (pinch and double-tap) — the house rule
document.addEventListener('gesturestart', e => e.preventDefault());
let lastTap = 0; document.addEventListener('touchend', e => { const t = Date.now(); if (t - lastTap < 300) e.preventDefault(); lastTap = t; }, { passive: false });

const stage = $('stage'), renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio)); stage.append(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(getComputedStyle(document.documentElement).getPropertyValue('--field').trim() || '#202833');   // the theme's well colour
scene.add(new THREE.GridHelper(6, 12, 0x5a4a70, 0x33293f));   // a floor to read height and spread against
const camera = new THREE.PerspectiveCamera(55, 1, 0.1, 100); camera.position.set(0, 1.9, 3.6); camera.lookAt(0, 0.9, 0);
scene.add(new THREE.HemisphereLight('#ffffff', '#445', 2));
const floor = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), new THREE.MeshStandardMaterial({ color: '#3a4250' })); floor.rotation.x = -Math.PI / 2; scene.add(floor);   // sc:overlay — the workspace stage, not a scene
const particles = createParticles(scene);
await particles.loadLibrary();
let lib = []; try { lib = await (await fetch('./assets/fx/index.json')).json(); } catch {}
const all = { ...FX }; for (const n of lib) try { all[n] = await (await fetch(`./assets/fx/${n}.fx.json`)).json(); } catch {}

let P = structuredClone(all.sparks);
for (const n of Object.keys(all)) $('base').append(new Option(n + (FX[n] ? '' : ' (yours)'), n));
function build() {
  $('fields').innerHTML = '';
  for (const f of PRESET_FIELDS) {
    const row = document.createElement('div'); row.className = 'row';
    const get = () => f.pair !== undefined ? P[f.key][f.pair] : P[f.key], set = v => { if (f.pair !== undefined) P[f.key][f.pair] = v; else P[f.key] = v; };
    if (f.pair !== undefined && !Array.isArray(P[f.key])) P[f.key] = [P[f.key] ?? f.min, P[f.key] ?? f.min];
    if (get() === undefined) set(f.def);
    row.innerHTML = `<label>${f.label}</label><input type="range" min="${f.min}" max="${f.max}" step="${f.step}" value="${get()}"><output>${get()}</output>`;
    const r = row.querySelector('input'), o = row.querySelector('output');
    r.oninput = () => { set(+r.value); o.textContent = r.value; };
    $('fields').append(row);
  }
  $('c0').value = new THREE.Color(P.color[0]).getHexString().replace(/^/, '#'); $('c1').value = new THREE.Color(P.color[1] || P.color[0]).getHexString().replace(/^/, '#');
  $('add').checked = !!P.add;
}
$('base').onchange = () => { P = structuredClone(all[$('base').value]); if (!FX[$('base').value]) $('name').value = $('base').value; build(); };
$('c0').oninput = () => { P.color[0] = $('c0').value; }; $('c1').oninput = () => { P.color[1] = $('c1').value; };
$('add').onchange = () => { P.add = $('add').checked; };
const fire = () => particles.burst({ preset: structuredClone(P), at: [0, 0.8, 0] });
$('burst').onclick = fire;
$('everyOut').textContent = $('every').value + ' s'; $('every').oninput = () => { $('everyOut').textContent = $('every').value + ' s'; };
$('copy').onclick = async () => { const j = JSON.stringify(cleanPreset(P), null, 2); try { await navigator.clipboard.writeText(j); $('msg').textContent = 'Copied.'; } catch { $('msg').textContent = j; } };
$('save').onclick = async () => {
  const name = $('name').value.trim();
  if (!/^[a-z0-9_]+$/.test(name)) { $('msg').textContent = 'Name it with lowercase_and_underscores first.'; return; }
  try {
    const r = await fetch('./fx/save', { method: 'POST', body: JSON.stringify({ name, preset: cleanPreset(P) }) });
    const j = await r.json(); if (!r.ok) throw new Error(j.error || r.status);
    $('msg').textContent = `Saved ${j.path} — use it as an Emitter preset: "${name}".`;
  } catch (e) { $('msg').textContent = `Can't save here (${e.message}) — this page saves through the dev server. Copy JSON instead.`; }
};
build();
const clock = new THREE.Clock(); let t = 0;
function resize() { const w = stage.clientWidth, h = stage.clientHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
renderer.setAnimationLoop(() => {
  const dt = Math.min(0.05, clock.getDelta()), every = +$('every').value;
  if (every > 0 && (t += dt) >= every) { t = 0; fire(); }
  particles.update(dt, camera, renderer); renderer.render(scene, camera);
});
window.__vfx = { particles, get preset() { return P; } };
</script>
</body>
</html>
