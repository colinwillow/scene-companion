<style>
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text);

  canvas { display:block; position:fixed; inset:0; width:100%; height:100%; touch-action:none; }

  :root { --barH: 58px; --dockH: 66px; }

  #bar #sceneBtn .iw { overflow:hidden; text-overflow:ellipsis; font-size:14px; }
  /* the scene picker: the same picture cards as play.html's Scenes */
  #sceneSheet { position:fixed; inset:0; z-index:9; background:var(--scrim); display:flex; align-items:center; justify-content:center; }

  #sceneCards { display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:10px; }
  #sceneCards button { all:unset; box-sizing:border-box; cursor:pointer; display:flex; flex-direction:column; border-radius:var(--r-lg); background:var(--raised); box-shadow:var(--sh-1); overflow:hidden; border:2px solid transparent; }
  #sceneCards button.here { border-color:var(--accent); }

  #sceneCards .pic img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  #sceneCards .pic b { position:absolute; left:8px; right:8px; bottom:6px; font:800 15px/1.15 var(--font); color:#fff; text-shadow:0 1px 2px #000, 0 2px 10px #000c; }
  #sceneCards small { display:block; padding:7px 9px 9px; font:600 12px/1.3 var(--font); color:var(--dim); }
  #dock { position:fixed; left:0; right:0; bottom:0; z-index:2; display:flex; justify-content:center; gap:4px;
    padding:6px 6px calc(6px + env(safe-area-inset-bottom)); background:var(--panel); border-top:3px solid var(--accent); border-radius:var(--r-lg) var(--r-lg) 0 0; box-shadow:var(--sh-2); }
  #dock > * { flex:1 1 0; max-width:72px; }
  #dock #play { border-radius:var(--r-lg); }
  #addBtn select { position:absolute; inset:0; width:100%; height:100%; opacity:0; padding:0; border:0; }
  #score { position:fixed; z-index:2; right:calc(8px + env(safe-area-inset-right)); top:calc(var(--barH) + 4px + env(safe-area-inset-top)); font-size:var(--fs-sm); }
  #more { position:fixed; z-index:7; right:calc(8px + env(safe-area-inset-right)); top:calc(var(--barH) + 4px + env(safe-area-inset-top)); width:min(280px, calc(100vw - 16px)); padding:10px; display:flex; flex-direction:column; gap:8px; }

  #lib.open, #tree.open { animation:sheetDown .22s var(--ease) both; }

      #panel { position:fixed; left:0; right:0; bottom:0; height:var(--sheet, 42vh); z-index:4; display:flex; flex-direction:column;
    background:var(--panel); border-top:1px solid var(--line); border-radius:16px 16px 0 0; transition:height .22s ease; }

    touch-action: pan-y; -webkit-user-select:text; user-select:text; overscroll-behavior:contain; }
  #panel.closed { display:none; }

  @media (orientation: landscape) and (min-width: 600px) {

  }
  #panel h3 { margin:0 0 6px; font-size:15px; }

  .beh input[type=range] { --fill:var(--bc); }

  #panel h3.nameRow .nmEdit { flex:1; font:800 17px var(--font); padding:6px 8px; }
  .tour { position:fixed; inset:0; z-index:80; }

  .beh details.more summary::before { content:'▸ '; } .beh details.more[open] summary::before { content:'▾ '; }
  .beh .chev { color:var(--dim); transition:transform .18s; }

    border:1px solid var(--line); border-radius:6px; padding:4px; font:inherit; }

  .row output { min-width:52px; text-align:right; font-variant-numeric:tabular-nums; color:var(--text); font-weight:700; font-size:13px; }

  /* card grid for Characters / Props / Kit: a big thumbnail, the name, one small line */

  #lib .tabs button.on { background:var(--accent); color:var(--on-accent); }

<body class="ui mode-edit">
<div id="bar" class="tbar">
  <select id="scenePick" title="Open another scene" hidden></select>
  <button id="sceneBtn" class="ib side" data-icon="scenes" title="Open another scene">Scenes</button>
  <button id="undo" data-icon="undo" title="Undo (Ctrl+Z)" disabled>Undo</button>
  <button id="redo" data-icon="redo" title="Redo (Ctrl+Shift+Z)" disabled>Redo</button>
  <button id="push" data-icon="save" title="Save: commit this scene to GitHub (in the desktop app: to disk / the project)">Save</button>
  <button id="moreBtn" data-icon="more" title="More: look, quality, theme, copy the scene JSON">More</button>
</div>
<span id="score" class="pill">★ 0</span>
<div id="more" class="sheet" hidden>
  <label class="mrow"><span>Look</span><select id="look" title="Look profile: toon, baked or pbr lighting"><option>toon</option><option>baked</option><option>pbr</option></select></label>
  <label class="mrow"><span>Quality</span><select id="tier" title="Quality tier: web (phones) · desktop · ultra (soft shadows, reflections — the desktop app's default)"><option>web</option><option>desktop</option><option>ultra</option></select></label>
  <label class="mrow"><span>Theme</span><select id="theme" title="UI theme (a taste switch): warm is the new look, classic is the look before Stage 9"><option value="warm">warm</option><option value="classic">classic</option></select></label>
  <div class="mrow"><span>Buzz on tap</span><label class="toggle"><input type="checkbox" data-feel="haptics"><span></span></label></div>

const _warn=console.warn;console.warn=(...a)=>{_warn(...a);showErr(a.join(' '));};

const SCENE_URL = new URLSearchParams(location.search).get('scene') || (PROJECT && (await DESKTOP.core.invoke('list_project_scenes').catch(() => []))[0]) || './scenes/kitchen-sink.scene.json';
// The scene picker: every example scene (scenes/index.json); choosing one reopens the editor on it.
fetch('./scenes/index.json').then(r => r.json()).then(list => {

    const o = new Option('📁 ' + f.split('/').pop().replace('.scene.json', ''), f); o.selected = f.replace(/^\.\//, '') === here; sel.prepend(o); })).catch(() => {});
  else if (DESKTOP) DESKTOP.core.invoke('list_scenes').then(names => names.reverse().forEach(n => { const o = new Option('💾 ' + n, 'desktop:' + n); o.selected = SCENE_URL === 'desktop:' + n; sel.prepend(o); })).catch(() => {});

  sel.onchange = async () => {

        if (dir) location.href = await DESKTOP.core.invoke('open_project', { path: dir }); } catch (e) { showErr('Open project: ' + e); }

}).catch(() => {});
// 🎬 the scene sheet: one picture card per option of the (hidden) picker, so the desktop entries come along too
var sceneNotes = {};
$('sceneBtn').onclick = () => {
  const sel = $('scenePick'), box = $('sceneCards'); box.innerHTML = '';

    b.innerHTML = `<span class="pic">${/^(\.\/)?scenes\//.test(o.value) ? `<img alt="" loading="lazy" src="./thumbs/scenes/${stem}.jpg">` : ''}<b></b></span><small></small>`;

    b.onclick = () => { $('sceneSheet').hidden = true; if (o.selected && o.value !== '__open__') return; sel.value = o.value; sel.onchange?.(); };

};
$('sceneX').onclick = () => { $('sceneSheet').hidden = true; };
$('sceneSheet').onclick = e => { if (e.target.id === 'sceneSheet') $('sceneSheet').hidden = true; };
// In the desktop app a scene can come from this computer ("desktop:<name>", <Documents>/SceneCompanion/scenes)
let loadedText = SCENE_URL.startsWith('desktop:') ? await DESKTOP.core.invoke('load_scene', { name: SCENE_URL.slice(8) })
  : await (await fetch(SCENE_URL)).text();   // what the repo had when we opened it
const data = JSON.parse(loadedText);

const renderer = new THREE.WebGLRenderer({ antialias: true });
document.body.prepend(renderer.domElement);
const camera = new THREE.PerspectiveCamera(55, 1, 0.1, 3000);
camera.position.set(10, 11, 14);
const orbit = new OrbitControls(camera, renderer.domElement);
orbit.target.set(0, 0.5, 0);

// Touch: one finger pans (and taps select / drag the gizmo), two fingers orbit + pinch zoom.
const coarse = matchMedia('(pointer: coarse)').matches;
if (coarse) orbit.touches = { ONE: THREE.TOUCH.PAN, TWO: THREE.TOUCH.DOLLY_ROTATE };

// ---- bottom-sheet inspector (portrait): drag the handle, it snaps to peek / half / full; tap cycles.
const SNAPS = [0.11, 0.42, 0.85];          // fractions of the screen height
let sheet = 1;
function setSheet(i) { sheet = Math.max(0, Math.min(SNAPS.length - 1, i)); $('panel').style.setProperty('--sheet', SNAPS[sheet] * 100 + 'vh'); openSheet(true); }
// Phones (portrait): the inspector starts closed and selecting doesn't open it — a name chip does (✎ Edit).
// Landscape keeps its side panel. Closing: drag the handle down to the bottom, or tap it when full.
const wideNow = () => matchMedia('(orientation: landscape) and (min-width: 600px)').matches;
function openSheet(open) { $('panel').classList.toggle('closed', !open); updateChip(); }
function updateChip() {
  const show = !!selectedId && $('panel').classList.contains('closed');
  $('chip').hidden = !show;
  if (show) $('chipName').textContent = selectedId;
}
{
  const grab = $('grab'); let y0 = null, h0 = 0, cur = 0, moved = false;
  grab.addEventListener('pointerdown', e => { y0 = e.clientY; h0 = cur = SNAPS[sheet] * innerHeight; moved = false; grab.setPointerCapture(e.pointerId); $('panel').classList.add('dragging'); });
  grab.addEventListener('pointermove', e => {
    if (y0 === null) return;
    if (Math.abs(e.clientY - y0) > 6) moved = true;
    cur = Math.max(30, Math.min(innerHeight * 0.9, h0 + y0 - e.clientY));
    $('panel').style.setProperty('--sheet', cur + 'px');
  });
  const up = e => {
    if (y0 === null) return;
    $('panel').classList.remove('dragging');
    if (!moved) { if (sheet === SNAPS.length - 1) openSheet(false); else setSheet(sheet + 1); }
    else if (cur < innerHeight * 0.08) openSheet(false);
    else { const f = cur / innerHeight;
      setSheet(SNAPS.reduce((best, s, i) => Math.abs(s - f) < Math.abs(SNAPS[best] - f) ? i : best, 0)); }
    y0 = null;
  };

}

let world, post, playing = false, selectedId = null, score = 0;
let gizmo, selBox;
$('look').value = data.settings.look || 'toon';

async function rebuild() {
  gizmo?.detach();
  world?.dispose();
  world = new World(renderer, { tier: $('tier').value });
  window.__sc = { world, data, camera, orbit, rebuild, select }; // debug/test hook (headless checks, timing)

    if (!want) return;

    if (want === 'bridge') {                     // → Blender and back, with a script standing in for the add-on
      const ent = [...world.entities.values()].find(x => !x.inherited && modelPath(assetOf(x), world.characters));
      const back = new Promise(ok => DESKTOP.event.listen('bridge-return', e => ok(e.payload)));
      const sent = await bridgeSend({ id: ent.id, glb: modelPath(assetOf(ent), world.characters), scene: SCENE_URL }).catch(e => ({ error: String(e) }));
      const got = await Promise.race([back, new Promise(r => setTimeout(() => r('timeout'), 60000))]);
      await new Promise(r => setTimeout(r, 4000));      // onBridgeReturn's rebuild

    }

// Lights are invisible: give point / spot lights a small glowing marker so they can be tapped and dragged. Safe to call
// again after an in-place patch (only lights without one get one).
function addLightMarkers() {
  for (const ent of world.entities.values()) {
    const t = ent.data.light?.type;
    if (!['point', 'spot'].includes(t) || ent.object3d.userData.marker) continue;   // the sun follows the camera focus (shadows), so it isn't draggable
    const m = new THREE.Mesh(   // sc:overlay (editor-only light marker)
      t === 'spot' ? new THREE.ConeGeometry(0.22, 0.4, 12).translate(0, -0.1, 0) : new THREE.SphereGeometry(0.2, 12, 8),
      new THREE.MeshBasicMaterial({ color: ent.data.light.color || '#ffffff', toneMapped: false, fog: false }));
    m.castShadow = false; m.userData.noLook = true; ent.object3d.add(m); ent.object3d.userData.marker = m;   // sc:overlay (editor only)
  }
}

// Logic entities have no model, so the editor draws them (editor only): a CameraRig as a little camera with its zone and rail,
// a Checkpoint and a HudPrompt as rings of their radius on the ground.
function addBehaviorMarkers() {
  for (const ent of world.entities.values()) {
    const bs = ent.data.behaviors || [], o = ent.object3d;
    if (o.userData.bmarker) continue;
    const g = new THREE.Group(); g.userData.noLook = true;
    const ring = (r, color) => { const m = new THREE.Mesh(new THREE.RingGeometry(Math.max(0.05, r - 0.06), r, 48).rotateX(-Math.PI / 2),   // sc:overlay
      new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.6, side: THREE.DoubleSide, depthWrite: false, fog: false })); m.position.y = 0.03 - o.position.y; m.userData.noLook = true; g.add(m); };
    for (const b of bs) {
      const P = b.params || {};
      if (b.type === 'CameraRig') {
        const cam = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.25, 0.4), new THREE.MeshBasicMaterial({ color: '#7fe9ff', fog: false }));   // sc:overlay
        const lens = new THREE.Mesh(new THREE.ConeGeometry(0.16, 0.3, 12).rotateX(Math.PI / 2).translate(0, 0, 0.32), new THREE.MeshBasicMaterial({ color: '#7fe9ff', fog: false }));   // sc:overlay
        cam.userData.noLook = lens.userData.noLook = true; g.add(cam, lens);
        if (P.zone) ring(P.zone, '#7fe9ff');
        if (P.mode === 'rail' && P.path) {
          const pts = String(P.path).split(';').map(t => t.split(',').map(Number)).filter(a => a.length === 3 && a.every(Number.isFinite)).map(a => new THREE.Vector3(a[0] - o.position.x, a[1] - o.position.y, a[2] - o.position.z));
          if (pts.length > 1) { const l = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({ color: '#7fe9ff', fog: false })); l.userData.noLook = true; g.add(l); }   // sc:overlay
        }
      }
      if (b.type === 'Checkpoint') ring(P.radius ?? 2.5, '#3ddc84');
      if (b.type === 'HudPrompt') ring(P.radius ?? 3, '#ffffff');
    }
    if (g.children.length) { o.add(g); o.userData.bmarker = g; }
  }
}

// ---- editor: write gizmo changes back into scene data
const r3 = v => Math.round(v * 1000) / 1000;
function syncTransformToData() {
  const ent = world.getEntity(selectedId); if (!ent) return;
  const o = ent.object3d, e = ent.data;
  e.position = o.position.toArray().map(r3);
  e.rotation = [o.rotation.x, o.rotation.y, o.rotation.z].map(r => r3(THREE.MathUtils.radToDeg(r)));
  e.scale = o.scale.toArray().map(r3);
  renderPanel();
}

function select(id) {
  selectedId = id;
  sendSelect?.();

  updateChip();
  const ent = world.getEntity(id);
  if (ent && (!ent.data.light || ent.object3d.userData.marker) && !playing) gizmo?.attach(ent.object3d); else gizmo?.detach();   // gizmo is made at the end of the first rebuild
  renderPanel();
  renderTree();
  if (libTab === 'motions') renderLib();
}

// ---- hierarchy: every entity, searchable; tap to select and frame it
function entityTags(e) {
  const r = e.resolved || e.data;
  const what = e.data.prefab ? `⧉ ${e.data.prefab}` : e.data.light ? `☀ ${e.data.light.type}` : typeof e.data.asset === 'string' ? e.data.asset : '';
  return [what, ...(r.behaviors || []).map(b => b.type), ...(e.tags || []).map(t => `#${t}`), ...(e.inherited ? ['from prefab'] : [])].filter(Boolean);
}
function renderTree() {
  if (!$('tree').classList.contains('open') || !world) return;
  const wide = matchMedia('(orientation: landscape) and (min-width: 600px)').matches;
  $('tree').style.top = wide ? '' : $('bar').getBoundingClientRect().bottom + 'px';   // sit under the toolbar
  const q = $('treeSearch').value.trim().toLowerCase();

// ---- inspector generated from behavior schemas
function control(def, value, onChange) {
  if (def.type === 'rules') return rulesEditor(value || [], onChange);
  const row = document.createElement('div'); row.className = 'row';
  if (def.type === 'number') {
    const u = def._u ? ` ${def._u}` : '', show = v => fmtNum(v, def.step ?? 0.1) + u;
    row.innerHTML = `<input type="range" min="${def.min ?? 0}" max="${def.max ?? 10}" step="${def.step ?? 0.1}" value="${value}"><output>${show(value)}</output>`;
    const [inp, out] = row.children;
    inp.oninput = () => { out.textContent = show(inp.value); onChange(+inp.value); };
  } else if (def.type === 'boolean') {
    row.innerHTML = `<label class="toggle"><input type="checkbox" ${value ? 'checked' : ''}><span></span></label>`;
    row.querySelector('input').onchange = e => onChange(e.target.checked);
  } else if (def.type === 'vec3' || def.type === 'vec2') {
    // one stepper per axis: type a number, or drag the coloured X / Y / Z letter sideways to scrub (0.1 per 6 px)
    value.forEach((v, i) => {
      const cell = document.createElement('span'); cell.className = 'axis a' + i;
      cell.innerHTML = `<b title="Drag sideways to change">${'XYZ'[i]}</b>`;
      const inp = document.createElement('input'); inp.type = 'number'; inp.step = '0.1'; inp.value = v;
      const set = x => { const nv = [...value]; nv[i] = +(+x).toFixed(3); value = nv; inp.value = nv[i]; onChange(nv); };
      inp.onchange = () => set(inp.value);
      const grip = cell.firstChild;
      grip.onpointerdown = ev => { ev.preventDefault(); grip.setPointerCapture?.(ev.pointerId); const x0 = ev.clientX, v0 = +value[i];
        grip.onpointermove = m => set(v0 + Math.round((m.clientX - x0) / 6) * 0.1);
        grip.onpointerup = grip.onpointercancel = () => { grip.onpointermove = grip.onpointerup = null; }; };
      cell.append(inp); row.append(cell);
    });
  } else if (def.type === 'color') {
    row.innerHTML = `<input type="color" value="${value}">`;
    row.firstChild.oninput = e => onChange(e.target.value);
  } else {
    row.innerHTML = `<input type="text" value="${value}">`;
    row.firstChild.onchange = e => onChange(e.target.value);
  }
  return row;
}

// Reactions editor: "When ▾ [fields]  If [once] [cooldown] [chance]  Do ▾ [fields] …" per rule, dropdowns from the
// vocabulary in runtime/reactions.js (no code). Every change hands back a fresh copy of the whole list.
var showGraph = false;   // remembered across objects while the editor is open
function rulesEditor(rules, onChange) {
  const wrap = document.createElement('div'); wrap.className = 'rules';
  const commit = () => { onChange(structuredClone(rules)); draw(); };
  const fieldInputs = (obj, table) => {
    const box = document.createElement('span'); box.className = 'ruleFields';
    for (const [k, d] of Object.entries(table[obj.type] || {})) {
      const lab = document.createElement('label'); lab.textContent = k;
      if (Array.isArray(d)) {
        const v = obj[k] ?? d;
        v.forEach((n, i) => { const inp = document.createElement('input'); inp.type = 'number'; inp.step = '0.1'; inp.value = n;
          inp.onchange = () => { obj[k] = [...(obj[k] ?? d)]; obj[k][i] = +inp.value; commit(); }; lab.append(inp); });
      } else {
        const inp = document.createElement('input');
        inp.type = typeof d === 'number' ? 'number' : 'text'; if (inp.type === 'number') inp.step = 'any';
        inp.value = obj[k] ?? d;
        inp.onchange = () => { obj[k] = typeof d === 'number' ? +inp.value : inp.value; commit(); };
        lab.append(inp);
      }
      box.append(lab);
    }
    return box;
  };
  const typeSelect = (obj, table, onPick) => {
    const sel = document.createElement('select');
    sel.innerHTML = Object.keys(table).map(t => `<option ${t === obj.type ? 'selected' : ''}>${t}</option>`).join('');
    sel.onchange = () => onPick(sel.value);
    return sel;
  };

    wrap.innerHTML = '';
    rules.forEach((r, i) => {
      const card = document.createElement('div'); card.className = 'rule';
      const head = document.createElement('div'); head.className = 'ruleRow';
      head.innerHTML = '<b>When</b>';
      head.append(typeSelect(r.when, RX.WHEN, t => { r.when = RX.withDefaults(RX.WHEN, t); commit(); }), fieldInputs(r.when, RX.WHEN));
      const x = document.createElement('button'); x.textContent = '✕'; x.title = 'Delete rule'; x.onclick = () => { rules.splice(i, 1); commit(); };
      head.append(x);
      const cond = document.createElement('div'); cond.className = 'ruleRow';
      r.if ||= {};
      cond.innerHTML = `<b>If</b><label><input type="checkbox" ${r.if.once ? 'checked' : ''}> once</label><label>cooldown <input type="number" step="0.5" min="0" value="${r.if.cooldown ?? 0}"></label><label>chance <input type="number" step="0.1" min="0" max="1" value="${r.if.chance ?? 1}"></label><label>in state <input type="text" size="6" placeholder="any" value="${r.if.state ?? ''}"></label>`;
      const [once, cd, ch, stt] = cond.querySelectorAll('input');
      stt.onchange = () => { if (stt.value.trim()) r.if.state = stt.value.trim(); else delete r.if.state; commit(); };
      once.onchange = () => { r.if.once = once.checked; commit(); };
      cd.onchange = () => { r.if.cooldown = Math.max(0, +cd.value); commit(); };
      ch.onchange = () => { r.if.chance = Math.min(1, Math.max(0, +ch.value)); commit(); };
      card.append(head, cond);
      (r.do ||= []).forEach((a, j) => {
        const row = document.createElement('div'); row.className = 'ruleRow';
        row.innerHTML = `<b>${j ? 'and' : 'Do'}</b>`;
        row.append(typeSelect(a, RX.DO, t => { r.do[j] = RX.withDefaults(RX.DO, t); commit(); }), fieldInputs(a, RX.DO));
        const rm = document.createElement('button'); rm.textContent = '–'; rm.title = 'Remove action';
        rm.onclick = () => { r.do.splice(j, 1); if (!r.do.length) r.do.push(RX.withDefaults(RX.DO, 'say')); commit(); };
        row.append(rm); card.append(row);

      const addA = document.createElement('button'); addA.className = 'ruleAdd'; addA.textContent = '+ action';
      addA.onclick = () => { r.do.push(RX.withDefaults(RX.DO, 'say')); commit(); };
      card.append(addA);

    box.firstChild.onclick = () => { box.classList.toggle('closed'); box.classList.contains('closed') ? behClosed.add(b.type) : behClosed.delete(b.type);

    const keys = Object.entries(Cls.schema).filter(([, d]) => d.type !== 'hidden').map(([k]) => k);   // hidden: the behavior's own tools edit it

      more.innerHTML = `<summary>More settings <small>(${rest.length})</small></summary>`; }

    panel.append(box);

  if (!playing) {

    add.onchange = async () => { if (!add.value) return; record(); (e.behaviors ||= []).push({ type: add.value, params: {} }); await rebuild(); };
    panel.append(add);
  }
}

// ---- 🖌 Scatter brush: pick a prefab, drag on the ground/solids; instances land `gap` apart with a random turn
// and size variety (jitter slider). 🧽 Erase mode removes that prefab's instances under the drag. One undo step and
// one rebuild per stroke. One finger/left mouse paints; two fingers orbit + zoom (right mouse pans, wheel zooms).
let scatterOn = false, eraseMode = false, stroke = null, twoFinger = false;
const brushPointers = new Set();
const savedNav = { touch: orbit.touches.ONE, mouse: orbit.mouseButtons.LEFT };
function fillScatter() {
  const show = shown(), names = [...new Set([...Object.keys(data.prefabs || {}), ...prefabLibrary.filter(n => show({ kind: 'prefab', name: n }))])].sort();
  const cur = $('scPrefab').value || ['grass_tuft', 'tree', 'rock_round'].find(n => names.includes(n)) || names[0];
  $('scPrefab').innerHTML = names.map(n => `<option ${n === cur ? 'selected' : ''}>${n}</option>`).join('');
}
$('scatter').onclick = () => {
  if (playing) return;
  scatterOn = !scatterOn;
  if (stroke) cancelStroke();
  $('scatter').classList.toggle('on', scatterOn); $('scatterBar').hidden = !scatterOn; paintMode();
  // keep the orbit controls on so two fingers still orbit/zoom; only the one-finger / left-button drag is the brush's
  orbit.touches.ONE = scatterOn ? -1 : savedNav.touch;
  orbit.mouseButtons.LEFT = scatterOn ? -1 : savedNav.mouse;
  if (scatterOn) { select(null); fillScatter(); }
};
$('scMode').onclick = () => {
  eraseMode = !eraseMode;
  setIcon($('scMode'), eraseMode ? 'erase' : 'brush', eraseMode ? 'Erase' : 'Paint');
  $('scatterBar').classList.toggle('erase', eraseMode);
  $('scHint').textContent = eraseMode ? '1 finger erases · 2 fingers orbit' : '1 finger paints · 2 fingers orbit';
};
$('scSpacing').oninput = () => { $('scSpacingV').textContent = (+$('scSpacing').value).toFixed(2).replace(/\.?0+$/, '') + ' m'; };
const ndcOf = e => new THREE.Vector2((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
const brushDot = (p, color) => {
  const dot = new THREE.Mesh(new THREE.SphereGeometry(0.15, 8, 6), new THREE.MeshBasicMaterial({ color }));   // sc:overlay (stroke preview)
  dot.position.fromArray(p); dot.raycast = () => {}; world.scene.add(dot); stroke.dots.push(dot);
};
function strokeAt(e) {
  const hit = surfaceHit(ndcOf(e)); if (!hit) return;
  const p = hit.point.toArray(), gap = +$('scSpacing').value;
  if (stroke.erase) {
    for (const id of scatterEraseIds(data, $('scPrefab').value, [p], eraseRadius(gap))) {
      if (stroke.ids.has(id)) continue;
      stroke.ids.add(id);
      const pos = data.entities.find(x => x.id === id).position;   // painted instances are top-level
      brushDot([pos[0], pos[1] + 0.3, pos[2]], 0xff5d5d);
    }
    return;
  }
  for (const q of scatterPoints([p], gap, stroke.placed)) { stroke.points.push(q); brushDot(q, 0x3ddc84); }
}
function cancelStroke() {
  for (const d of stroke.dots) { world.scene.remove(d); d.geometry.dispose(); d.material.dispose(); }
  stroke = null;
}
renderer.domElement.addEventListener('pointerdown', e => {
  if (!scatterOn) return;
  brushPointers.add(e.pointerId);
  if (brushPointers.size > 1) { twoFinger = true; if (stroke) cancelStroke(); return; }   // second finger → orbit, drop the stroke
  if (stroke || twoFinger || (e.pointerType === 'mouse' && e.button !== 0)) return;
  stroke = { id: e.pointerId, erase: eraseMode, placed: [], points: [], ids: new Set(), dots: [] };
  try { renderer.domElement.setPointerCapture(e.pointerId); } catch {}

});
renderer.domElement.addEventListener('pointermove', e => { if (stroke && e.pointerId === stroke.id) strokeAt(e); });
const endStroke = async e => {
  brushPointers.delete(e.pointerId);

  if (!stroke || e.pointerId !== stroke.id) return;
  const { points, ids, erase } = stroke; cancelStroke();
  if (e.type === 'pointercancel') return;
  const name = $('scPrefab').value;
  if (erase) {
    if (!ids.size) return;
    record();
    for (const id of ids) deleteEntity(data, id);
  } else {
    if (!points.length) return;
    record();
    if (!data.prefabs?.[name]) data.prefabs = { ...data.prefabs, [name]: `./prefabs/${name}.prefab.json` };
    const opts = jitterOptions(+$('scJitter').value);
    for (const p of points) scatterEntity(data, name, p.map(v => Math.round(v * 1000) / 1000), Math.random, opts);
  }
  await refresh(); fillAdd(); renderTree();
};
renderer.domElement.addEventListener('pointerup', endStroke);
renderer.domElement.addEventListener('pointercancel', endStroke);

// ---- 🧱 tile painting: with a Tilemap's palette open, one finger paints the picked tile on the map's plane (side view: the
// plane through the entity facing +z; top view: the top of the first layer), ✕ erases; two fingers still orbit. The live
// Tilemap repaints as the finger moves; the rows are written to the scene once per stroke (one undo step).
let tileOn = null, tileKey = null, tileStroke = null;
const tilePointers = new Set();
function tileInst() { return world.getEntity(tileOn)?.behaviors.find(b => b.constructor.name === 'Tilemap'); }
function tilePaint(id) {
  if (playing) return;
  if (scatterOn) $('scatter').onclick();
  tileOn = id; const T = tileInst(); if (!T) { tileOn = null; return; }
  const P = T.params, [cols, rows] = P.frames || [1, 1], keys = Object.keys(P.legend || {});
  tileKey = keys[0] ?? '#';
  $('tilePal').innerHTML = '';
  for (const k of [...keys, '.']) {
    const b = document.createElement('button'), L = P.legend[k] || {};
    b.title = k === '.' ? 'erase' : `“${k}”${L.solid === false ? ' (not solid)' : ''}`;
    if (k === '.') b.textContent = '✕';
    else if (L.color) b.style.backgroundColor = L.color;
    else if (P.sheet) { const f = L.frame ?? 0; Object.assign(b.style, { backgroundImage: `url(${P.sheet})`, backgroundSize: `${cols * 100}% ${rows * 100}%`,
      backgroundPosition: `${cols > 1 ? (f % cols) / (cols - 1) * 100 : 0}% ${rows > 1 ? Math.floor(f / cols) / (rows - 1) * 100 : 0}%` }); }
    else b.textContent = k;
    b.onclick = () => { tileKey = k; for (const x of $('tilePal').children) x.classList.toggle('on', x === b); };
    if (k === tileKey) b.classList.add('on');
    $('tilePal').append(b);

}
// the accent follows the mode: orange editing, violet while a brush (scatter / tiles) is out
function paintMode() { document.body.classList.toggle('mode-paint', !$('scatterBar').hidden || !$('tileBar').hidden); }
function tileStop() { tileOn = null; tileStroke = null; $('tileBar').hidden = true; paintMode(); orbit.touches.ONE = savedNav.touch; orbit.mouseButtons.LEFT = savedNav.mouse; }
$('tileDone').onclick = tileStop;
window.__scTile = { tilePaint, tileStop };   // test hook (headless checks)
function tileAt(e) {
  const T = tileInst(); if (!T) return;
  const P = T.params, o = T.entity.object3d.position, top = P.plane === 'top';
  ray.setFromCamera(ndcOf(e), camera);
  const plane = new THREE.Plane(top ? new THREE.Vector3(0, 1, 0) : new THREE.Vector3(0, 0, 1), top ? -(o.y + P.cell) : -o.z), hit = new THREE.Vector3();
  if (!ray.ray.intersectPlane(plane, hit)) return;
  const { nRows } = TILE.mapSize(P.rows), at = TILE.cellAt(hit.x - o.x, hit.y - o.y, hit.z - o.z, nRows, { cell: P.cell, plane: P.plane });
  if (!at) return;
  const k = top ? `${at.c},${at.r}` : `${at.c},${nRows - 1 - at.r}`;   // by height from the bottom: rows added on top shift r, not that
  if (tileStroke.done.has(k)) return; tileStroke.done.add(k);
  T.paint(at.c, at.r, tileKey);

}
renderer.domElement.addEventListener('pointerdown', e => {
  if (!tileOn) return;
  tilePointers.add(e.pointerId);
  if (tilePointers.size > 1) { tileStroke = null; return; }
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  record(); tileStroke = { id: e.pointerId, done: new Set(), changed: false };
  try { renderer.domElement.setPointerCapture(e.pointerId); } catch {}
  tileAt(e);
});
renderer.domElement.addEventListener('pointermove', e => { if (tileOn && tileStroke && e.pointerId === tileStroke.id) tileAt(e); });
const tileEnd = async e => {
  tilePointers.delete(e.pointerId);

  const changed = tileStroke.changed; tileStroke = null;
  if (!changed) return;
  const ent = findEntity(data, tileOn)?.entity, T = tileInst();
  if (ent && T) setOverride(ent, 'Tilemap', 'rows', [...T.params.rows]);
  await refresh();
};
renderer.domElement.addEventListener('pointerup', tileEnd);
renderer.domElement.addEventListener('pointercancel', tileEnd);

// ---- tapping: select in edit mode, move the player in play mode
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
let downAt = null;
renderer.domElement.addEventListener('pointerdown', e => (downAt = [e.clientX, e.clientY]));
renderer.domElement.addEventListener('pointerup', e => {
  if (scatterOn || tileOn) return;
  if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 8 || gizmo.dragging) return;
  ptr.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ptr, camera);
  const hits = ray.intersectObjects(world.scene.children, true).filter(h => h.object.visible && !isGizmo(h.object));
  if (playing) {
    const g = hits.find(h => h.point.y < 0.3 && entityIdOf(h.object) !== 'player');   // any floor surface
    if (g) world.emit('moveTo', g.point.toArray());
    return;
  }
  let id = hits.length ? entityIdOf(hits[0].object) : null;
  while (id && world.getEntity(id)?.inherited) id = world.getEntity(id).parent;   // a prefab's own child: edit the instance
  const ent = id && world.getEntity(id);
  if (ent && isGround(id, ent.resolved)) id = null;    // tapping the ground deselects quietly (pick it from ☰ List)
  if (id !== selectedId) select(id);
});
const isGizmo = o => { while (o) { if (o.isTransformControlsRoot || o.type === 'TransformControlsGizmo' || o.type === 'TransformControlsPlane') return true; o = o.parent; } return false; };
const entityIdOf = o => { while (o) { if (o.userData.entityId) return o.userData.entityId; o = o.parent; } return null; };

// ---- save to GitHub (fine-grained token with Contents read/write, kept on this device only)

$('push').onclick = async () => {

var sendSelect, liveOn = () => false;
{
  let ws, lastSent = '', gameErrors = 0, stale;
  sendSelect = () => { if (ws?.readyState === 1) ws.send(JSON.stringify({ type: 'select', url: SCENE_URL, id: selectedId })); };
  liveOn = () => ws?.readyState === 1;
  const connect = () => {
    try { ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/live`); } catch { return; }
    ws.onopen = () => { renderPanel(); lastSent = ''; $('play').title = 'Live link on'; $('liveBadge').hidden = false; $('liveBadge').textContent = describeState(null); sendSelect(); };
    ws.onclose = () => { $('liveBadge').hidden = true; setTimeout(connect, 3000); };
    ws.onmessage = ev => {

        editorCommand(s.op, s.args || {}).then(
          r => ws.send(JSON.stringify({ type: 'cmd-result', id: s.id, ok: true, ...r })),

        return;
      }

      if (s.type === 'pick' && sameScene(s.url, SCENE_URL)) {                     // tapped in a running game
        if (!s.id || world.getEntity(s.id)) { select(s.id); if (s.id) frame(s.id); }
        return;
      }

      $('liveBadge').textContent = describeState(s, gameErrors);

      const li = $('liveIn');
      if (li) li.textContent = s.selected && s.selected.id === selectedId

    };
  };
  if (location.protocol.startsWith('http') && new URLSearchParams(location.search).get('live') !== '0') connect();
  setInterval(() => {
    if (ws?.readyState !== 1) return;
    const text = JSON.stringify({ type: 'scene', url: SCENE_URL, data });
    if (text !== lastSent) { ws.send(text); lastSent = text; flashLive(); }
  }, 250);
}

async function editorCommand(op, args) {
  if (COMMANDS[op]) {
    const ctx = { schemas: Object.fromEntries(behaviorNames().map(n => [n, getBehavior(n).schema])), prefabs: world.prefabs, library: {},
      packs: /pack/.test(op) || op === 'batch' ? await loadPacks() : libPacks || [], unlocks: packUnlocks(),
      motions: /motion/.test(op) || op === 'batch' ? await loadMotionIndex() : null };
    // spawning a prefab the scene doesn't list yet: fetch it from prefabs/ (commands.js adds it to the scene)
    const placing = t => t === 'spawn' || t === 'add_light';
    const spawns = placing(op) ? [args] : op === 'batch' ? (args.calls || []).filter(c => placing(c?.tool)).map(c => c.args || {}) : [];
    for (const name of new Set(spawns.map(a => a.prefab).filter(n => typeof n === 'string' && /^[a-z0-9_]+$/.test(n) && !data.prefabs?.[n])))
      try { const r = await fetch(`./prefabs/${name}.prefab.json`); if (r.ok) ctx.library[name] = await r.json(); } catch {}
    // spawn with no position: drop it where the editor is looking (screen centre on the ground / a solid)
    if (spawns.some(a => a.position === undefined)) { const p = viewDropPoint(); for (const a of spawns) if (a.position === undefined) a.position = p; }
    if (COMMANDS[op].mutates && playing) throw new Error('Stop play mode first (use the stop tool) — edits made while playing are thrown away.');
    const before = structuredClone(data);
    const { result, changed } = runCommand(data, op, args, ctx);
    if (changed) {
      hist.record(before); updateUndo();
      if (selectedId && !findEntity(data, selectedId)) selectedId = null;
      await refresh(before);   // moves, params, adds and deletes patch in place (fast); the rest rebuilds
      renderPanel();
    }
    return { result };
  }
  switch (op) {
    case 'ping': return { result: { scene: SCENE_URL, playing } };
    case 'get_selection': return { result: selectedId ? runCommand(data, 'get_entity', { id: selectedId }, { prefabs: world.prefabs }).result : null };
    case 'select':
      if (args.id && !world.getEntity(args.id)) throw new Error(`No entity "${args.id}"`);
      select(args.id || null); if (args.id) frame(args.id);
      return { result: { selected: selectedId } };
    case 'play': case 'stop':
      if ((op === 'play') !== playing) await $('play').onclick();
      if (op === 'play' && args.seconds) await new Promise(r => setTimeout(r, Math.min(10, args.seconds) * 1000));
      return { result: { playing } };
    case 'screenshot': {
      const max = Math.min(1024, args.maxSize || 768);
      if (post) post.render(); else renderer.render(world.scene, camera);       // draw now so the buffer is fresh
      const src = renderer.domElement, k = Math.min(1, max / Math.max(src.width, src.height));
      const c = document.createElement('canvas'); c.width = Math.round(src.width * k); c.height = Math.round(src.height * k);
      c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
      return { result: { width: c.width, height: c.height, playing, selected: selectedId }, image: c.toDataURL('image/jpeg', 0.8).split(',')[1], mime: 'image/jpeg' };
    }
    case 'read_errors': {

      if (args.clear) { box.textContent = ''; box.hidden = true; }
      return { result: { errors } };
    }

}

      items.push({ name: `🎞 Motion library — ${lib.count || lib.motions.length} clips${q ? '' : ' (search: jump, idle, sword…)'}`, header: true });
      for (const m of hits) items.push({ name: m.name, sub: m.sub, pick: async () => {
        if (playing || ent.inherited) return;
        $('libCount').textContent = `Retargeting ${m.name} onto ${selectedId}…`;
        record(); addMotion(ent.data, m.stem); ent.data.animation = m.stem;
        await refresh(); select(selectedId); renderLib();
        const errs = world.motionErrors || []; if (errs.length) showErr('Motion library: ' + errs.join('; '));
      } });
    } else items.push({ name: '🎞 Motion library not connected', sub: 'run `npm run dev` next to a retarget-anims checkout (or set SC_MOTIONS)', header: true });
    $('libCount').textContent = `${selectedId}: ${ent.anim.clips.length} motion${ent.anim.clips.length === 1 ? '' : 's'}`;
  } else {
    await loadPacks(); if (seq !== libSeq) return;
    const show = shown(), group = libraryGroups(libPrefabs, data)[libTab].concat(libTab === 'characters' ? characterLibrary : []).filter(show);
    items = filterNames(group, q).map(i => ({ name: i.name, thumb: thumbIndex[`${i.kind}:${i.name}`],
      sub: i.kind === 'prefab' ? (data.prefabs?.[i.name] ? 'prefab' : 'prefab · not in scene yet') : i.kind === 'character' ? 'character · plays its roles' : 'model',
      place: ndc => (i.kind === 'character' ? addCharacterFrom(i, ndc) : addFrom(i.kind, i.name, ndc)),
      pick: () => { i.kind === 'character' ? addCharacterFrom(i) : addFrom(i.kind, i.name); if (!wide) closeLib(); } }));
    $('libCount').textContent = playing ? 'Stop play to add things' : `${items.length} ${libTab === "kit" ? "level kit pieces" : libTab} — tap to preview, hold and drag onto the scene to place`;
  }
  if (seq !== libSeq) return;
  if (!items.length) items = [{ header: true, name: q ? `Nothing matches “${q}”` : 'Nothing here yet',   // a friendly empty state, never a blank list
    sub: q ? 'try a shorter or different word' : ({ characters: 'add a character.json folder under assets/, or install a pack', props: 'prefabs/ and the scene\'s models show up here', kit: 'level kit pieces come from packs — see the Packs tab', sounds: 'drop .mp3 / .ogg files in assets/audio and run npm run assets', ext: 'see extensions/README.md' }[libTab] || '') }];
  const grid = ['characters', 'props', 'kit'].includes(libTab);   // things you place: a card grid with a preview
  ul.classList.toggle('grid', grid); libPreview(null);
  ul.innerHTML = '';
  for (const it of items) {
    const li = document.createElement('li');
    li.innerHTML = '<span></span><small></small>';
    li.firstChild.textContent = grid && !it.header ? friendly(it.name) : it.name; li.lastChild.textContent = it.sub;
    if (grid) li.title = it.name;
    if (it.thumb) { const img = new Image(); img.src = it.thumb; img.alt = ''; img.loading = 'lazy'; li.prepend(img); li.classList.add('thumb'); }
    else if (grid && !it.header) li.prepend(placeholder(it.name));
    if (it.header) li.className = 'head';
    else if (grid) { li.onclick = () => { if (dragJustEnded) return; libPreview(it, li); }; if (it.place) cardDrag(li, it); }
    else li.onclick = it.pick;
    if (it.locked) li.classList.add('locked');
    if (it.btn) { const b = document.createElement('button'); b.className = 'packbtn'; b.textContent = it.btn;
      b.onclick = ev => { ev.stopPropagation(); it.act(); }; li.append(b); }
    ul.append(li);
  }
}
// A letter on a colour from the name, for things with no thumbnail yet
function placeholder(name) {
  const d = document.createElement('div'); d.className = 'ph'; d.textContent = (name.replace(/^[^a-z0-9]+/i, '')[0] || '?').toUpperCase();
  let h = 0; for (const c of name) h = (h * 31 + c.charCodeAt(0)) % 360; d.style.setProperty('--h', h); return d;
}
// Tap a card: a preview strip (bigger picture, name, Add) — adding is a deliberate second tap, not an accident
function libPreview(it, li) {
  const box = $('libPrev'); for (const x of $('libList').querySelectorAll('.picked')) x.classList.remove('picked');
  if (!it) { box.hidden = true; return; }
  li?.classList.add('picked');
  box.innerHTML = `<span class="pt"><b></b><small></small></span><button class="primary ib side" data-icon="add">Add</button><button class="ghost ib side icon-only" data-icon="close">Close</button>`;
  box.prepend(it.thumb ? Object.assign(new Image(), { src: it.thumb, alt: '' }) : placeholder(it.name));
  box.querySelector('b').textContent = friendly(it.name); box.querySelector('small').textContent = `${it.sub} · or hold and drag it onto the scene`;
  iconize(box);
  const [add, x] = box.querySelectorAll('button');
  add.onclick = () => { libPreview(null); it.pick(); }; x.onclick = () => libPreview(null);
  box.hidden = false;
}
// Hold a card (~0.3 s, thumb still) to pick it up, drag it over the scene and let go: it lands where it was dropped
var dragJustEnded = false;
function cardDrag(li, it) {
  let t = 0, start = null, ghost = null;
  const lift = () => { ghost = document.createElement('div'); ghost.className = 'dragGhost';
    ghost.append(li.querySelector('img, .ph')?.cloneNode(true) || ''); document.body.append(ghost); navigator.vibrate?.(10); };
  const move = e => {
    if (!ghost) { if (start && Math.hypot(e.clientX - start.x, e.clientY - start.y) > 8) { clearTimeout(t); start = null; } return; }
    e.preventDefault(); ghost.style.left = e.clientX + 'px'; ghost.style.top = e.clientY + 'px';
    const over = document.elementFromPoint(e.clientX, e.clientY); ghost.style.borderColor = over === renderer.domElement ? 'var(--ok)' : '';
  };
  const stopScroll = e => { if (ghost) e.preventDefault(); };
  li.addEventListener('touchmove', stopScroll, { passive: false });
  li.ondragstart = e => e.preventDefault();   // a native image drag would cancel the pointer stream
  li.onpointerdown = e => {
    if (playing) return;
    start = { x: e.clientX, y: e.clientY }; clearTimeout(t);
    t = setTimeout(() => { if (start) { lift(); move(e); } }, 300);
    const up = ev => {
      clearTimeout(t); removeEventListener('pointermove', move, true); removeEventListener('pointerup', up, true); removeEventListener('pointercancel', up, true);
      if (!ghost) return;
      ghost.remove(); ghost = null; dragJustEnded = true; setTimeout(() => (dragJustEnded = false), 50);
      if (ev.type === 'pointerup' && document.elementFromPoint(ev.clientX, ev.clientY) === renderer.domElement) {
        const r = renderer.domElement.getBoundingClientRect();
        it.place(new THREE.Vector2(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1));
      }
    };
    addEventListener('pointermove', move, true); addEventListener('pointerup', up, true); addEventListener('pointercancel', up, true);
  };
}
// ---- the sprite slicer: a sheet with its grid drawn over it, cols/rows, a height in metres, and the clips as text
// ("run 2-5 10"). "Add" writes the asset variant (runtime/sprites.js) and drops one at the view centre with a SpriteAnimator.
function openSlicer(src, name) {
  if (playing) return;
  const box = document.createElement('div');
  box.style.cssText = 'position:fixed;inset:0;z-index:50;background:#000c;display:flex;align-items:center;justify-content:center;padding:12px';
  box.innerHTML = `<div style="background:#151a22;border:1px solid #2a3340;border-radius:12px;padding:12px;max-width:520px;width:100%;max-height:100%;overflow:auto;color:#dde">
    <b>Slice “<span class="nm"></span>”</b><canvas style="position:static;display:block;width:100%;height:auto;max-height:40vh;object-fit:contain;image-rendering:pixelated;background:repeating-conic-gradient(#333 0 25%,#222 0 50%) 0 0/16px 16px;margin:8px 0;border-radius:6px"></canvas>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      <label>cols <input class="c" type="number" min="1" style="width:56px"></label><label>rows <input class="r" type="number" min="1" style="width:56px"></label>
      <label>height m <input class="h" type="number" step="0.1" value="1.5" style="width:64px"></label><label>name <input class="n" type="text" style="width:110px"></label></div>
    <div style="margin:8px 0 4px;font-size:13px;opacity:.8">Clips, one per line: name first-last fps (idle / run / jump / fall play by themselves)</div>
    <textarea class="t" rows="5" style="width:100%;font:13px monospace;background:#0e1218;color:#dde;border:1px solid #2a3340;border-radius:6px"></textarea>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:8px"><button class="x">Cancel</button><button class="ok" style="background:var(--accent);color:#111">Add to scene</button></div></div>`;
  document.body.append(box);
  const q = s => box.querySelector(s), cv = q('canvas'), img = new Image();
  q('.nm').textContent = name; q('.n').value = name.replace(/[^\w]/g, '_');
  const draw = () => {
    const cols = Math.max(1, +q('.c').value | 0), rows = Math.max(1, +q('.r').value | 0), k = Math.max(1, Math.floor(480 / img.width));
    cv.width = img.width * k; cv.height = img.height * k; const g = cv.getContext('2d'); g.imageSmoothingEnabled = false;
    g.drawImage(img, 0, 0, cv.width, cv.height); g.strokeStyle = '#ffb84a'; g.fillStyle = '#ffb84a'; g.font = `${10 * Math.max(1, k / 2)}px sans-serif`;
    const fw = cv.width / cols, fh = cv.height / rows;
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) { g.strokeRect(c * fw + 0.5, r * fh + 0.5, fw - 1, fh - 1); g.fillText(r * cols + c, c * fw + 3, r * fh + 12 * Math.max(1, k / 2)); }
  };
  img.onload = async () => {
    const [c, r] = guessGrid(img.width, img.height); q('.c').value = c; q('.r').value = r;
    const n = c * r; q('.t').value = clipText(n >= 8 ? { idle: [0, 1, 3], run: [2, 5, 10], jump: [6, 6, 1], fall: [7, 7, 1] } : { idle: [0, n - 1, 6] });
    // a sheet the Sprite bake page made carries its own variant next to it (<name>.sprite.json): grid, clips and size from that
    if (!src.startsWith('data:')) try { const v = await (await fetch(src.replace(/\.\w+$/, '.sprite.json'))).json();
      if (v.frames) { q('.c').value = v.frames[0]; q('.r').value = v.frames[1]; } if (v.clips) q('.t').value = clipText(v.clips); if (v.size) q('.h').value = v.size[1]; } catch {}
    draw();
  };
  img.onerror = () => { q('.nm').textContent = name + ' — could not load'; };
  img.src = src;
  q('.c').oninput = q('.r').oninput = draw;
  q('.x').onclick = () => box.remove();
  q('.ok').onclick = async () => {
    const id = (q('.n').value.trim() || 'sprite').replace(/[^\w]/g, '_'), cols = Math.max(1, +q('.c').value | 0), rows = Math.max(1, +q('.r').value | 0);
    const variant = spriteVariant({ path: src, cols, rows, imgW: img.width, imgH: img.height, height: +q('.h').value || 1.5, clips: parseClipText(q('.t').value) });
    record();
    data.assets = { ...data.assets, [id]: { variants: { web: variant } } };
    const e = addEntity(data, { asset: id }, viewDropPoint()); e.behaviors = [{ type: 'SpriteAnimator' }];
    box.remove(); await refresh(); select(e.id); fillAdd();
  };
}
var genBusy = '';
async function generate(id, input) {
  if (genBusy) return;
  genBusy = id; renderLib();
  try {
    const r = await fetch(`./gen/${id}`, { method: 'POST', body: JSON.stringify(input) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) showErr(`${id}: ${j.error || r.status}`);
  } catch (e) { showErr(`${id}: ${e.message}`); }
  genBusy = ''; renderLib();
}
async function addGenerated(path) {
  if (playing) return;
  record();
  const name = path.split('/').pop().replace(/\.glb$/, '');
  data.assets = { ...data.assets, [name]: { variants: { web: { glb: path } } } };
  const e = addEntity(data, { asset: name }, viewDropPoint());
  await refresh(); select(e.id); fillAdd();
}
function closeLib() { $('lib').classList.remove('open'); $('libBtn').classList.remove('on'); }
$('libBtn').onclick = () => {
  const open = !$('lib').classList.contains('open');
  if (open) { $('tree').classList.remove('open'); $('list').classList.remove('on'); }
  $('lib').classList.toggle('open', open); $('libBtn').classList.toggle('on', open); renderLib();
};
$('lib').querySelector('.tabs').onclick = ev => {
  const t = ev.target.closest('button')?.dataset.t; if (!t) return;
  libTab = t; for (const b of $('lib').querySelectorAll('.tabs button')) b.classList.toggle('on', b.dataset.t === t);
  $('lib').querySelector(`.tabs [data-t="${t}"]`)?.scrollIntoView({ inline: 'nearest', block: 'nearest', behavior: 'smooth' });
  renderLib();
};
$('libSearch').oninput = renderLib;
$('save').onclick = async () => {
  const json = JSON.stringify(data, null, 2);
  try { await navigator.clipboard.writeText(json); setIcon($('save'), 'check', 'Copied'); window.scToast?.('Scene JSON copied — paste it to Claude', 'ok'); }
  catch { const blob = new Blob([json], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = SCENE_URL.split('/').pop(); a.click(); setIcon($('save'), 'check', 'Saved'); }
  setTimeout(() => setIcon($('save'), 'copy', 'Copy'), 1500);
};

// ---- ▶ Timeline: scrub / play / loop / speed one clip on the selected character, and look at it from the front, side
// or top. Driving the clip's own AnimationAction (anim.action()); the clip it ends on is NOT saved — pick the
// animation in the inspector for that. Edit mode only.
const tl = { id: null, clip: null, playing: true, loop: true, speed: 1, fps: 30 };
function tlEnt() { return tl.id && world.getEntity(tl.id); }
function tlStart(clip) {
  const ent = tlEnt(); if (!ent?.anim) return;
  tl.clip = clip; tl.in = null; tl.out = null; tlTrimLabel();
  ent.anim.play(clip, { fade: 0, restart: true });
  const a = ent.anim.action(); if (!a) return;
  a.setLoop(tl.loop ? THREE.LoopRepeat : THREE.LoopOnce); a.clampWhenFinished = true;
  a.timeScale = tl.speed; a.paused = !tl.playing;
  tl.fps = TL.clipFps(a.getClip().tracks);
  $('tlScrub').max = a.getClip().duration;
}
function openTimeline(id) {
  const ent = world.getEntity(id); if (!ent?.anim || playing) return;
  tl.id = id; tl.playing = true;
  $('tlWho').textContent = id;
  $('tlClip').innerHTML = ent.anim.clips.map(c => `<option>${c}</option>`).join('');
  $('tlClip').value = ent.anim.current; tlStart(ent.anim.current);
  $('tlPlay').textContent = '⏸'; $('tl').hidden = false; openSheet(false);
}
function closeTimeline() {
  const ent = tlEnt(); $('tl').hidden = true; tl.id = null;
  if (ent?.anim) { ent.anim.play(ent.data.animation || ent.anim.current, { fade: 0.1, restart: true }); }
}
function tlView(v) {
  const ent = tlEnt(); if (!ent) return;
  const box = new THREE.Box3().setFromObject(ent.object3d), c = box.getCenter(new THREE.Vector3()), h = box.max.y - box.min.y || 1.7;
  const pos = TL.viewPose(c.toArray(), ent.object3d.rotation.y, h, v);
  orbit.target.copy(c); camera.position.fromArray(pos); orbit.update();
}
$('tlClip').onchange = () => tlStart($('tlClip').value);
$('tlPlay').onclick = () => { tl.playing = !tl.playing; $('tlPlay').textContent = tl.playing ? '⏸' : '▶';
  const a = tlEnt()?.anim?.action(); if (!a) return;
  if (tl.playing && !tl.loop && a.time >= a.getClip().duration - 1e-3) { a.reset(); a.play(); }   // replay a finished one-shot
  a.paused = !tl.playing; };
$('tlLoop').onclick = () => { tl.loop = !tl.loop; $('tlLoop').classList.toggle('on', tl.loop);
  const a = tlEnt()?.anim?.action(); if (a) a.setLoop(tl.loop ? THREE.LoopRepeat : THREE.LoopOnce); };
$('tlSpeed').onchange = () => { tl.speed = +$('tlSpeed').value; const a = tlEnt()?.anim?.action(); if (a) a.timeScale = tl.speed; };
$('tlScrub').oninput = () => {
  const ent = tlEnt(), a = ent?.anim?.action(); if (!a) return;
  tl.playing = false; $('tlPlay').textContent = '▶';
  a.paused = true; a.enabled = true; a.time = +$('tlScrub').value; ent.anim.mixer.update(0);
};
$('tlX').onclick = closeTimeline;
// Edits: trim markers, body mask and the speed above become a clip VARIANT saved on this object (scene file `clips`),
// so it can be picked as its animation / a role / by Reactions. Events at the playhead go in the object's `events`.
function tlTrimLabel() { $('tlTrim').textContent = tl.in !== null || tl.out !== null ? `trim ${(tl.in ?? 0).toFixed(2)}–${tl.out !== null ? tl.out.toFixed(2) : 'end'} s` : ''; }
const tlNow = () => tlEnt()?.anim?.action()?.time ?? 0;
$('tlIn').onclick = () => { tl.in = +tlNow().toFixed(3); if (tl.out !== null && tl.out <= tl.in) tl.out = null; tlTrimLabel(); };
$('tlOut').onclick = () => { const t = +tlNow().toFixed(3); if (t > (tl.in ?? 0)) { tl.out = t; tlTrimLabel(); } };
$('tlEvent').onclick = async () => {
  const ent = tlEnt(); if (!ent || playing) return;
  const name = (prompt(`Event at ${tlNow().toFixed(2)} s in ${tl.clip} (e.g. hit, foot, spark):`) || '').trim();
  if (!/^[A-Za-z][A-Za-z0-9_]*$/.test(name)) return;
  record(); const ev = (ent.data.events ||= {}); (ev[tl.clip] ||= []).push({ t: +tlNow().toFixed(3), name });
  ev[tl.clip].sort((a, b) => a.t - b.t);
  { const id = tl.id, clip = tl.clip, t = tlNow(); closeTimeline(); await refresh(); select(id); openTimeline(id); $('tlClip').value = clip; tlStart(clip); }
  $('tlTrim').textContent = `+ ${name} @ ${tlNow().toFixed(2)} s (Reactions: When frame ${name})`;
};
$('tlSave').onclick = async () => {
  const ent = tlEnt(); if (!ent || playing) return;

  const name = (prompt('Name for the new clip:', `${base}_cut`) || '').trim();
  if (!name || ent.anim.clips.includes(name) && !ent.data.clips?.[name]) return;
  const spec = { from: base, ...(tl.in !== null ? { start: tl.in } : {}), ...(tl.out !== null ? { end: tl.out } : {}),
    ...(tl.speed !== 1 ? { rate: tl.speed } : {}), ...($('tlMask').value ? { mask: $('tlMask').value } : {}) };
  record(); (ent.data.clips ||= {})[name] = spec;

for (const b of document.querySelectorAll('#tl .tlViews button')) b.onclick = () => tlView(b.dataset.v);
function tlTick() {
  if (!tl.id) return;
  const ent = tlEnt(), a = ent?.anim?.action();
  if (!ent || playing) { closeTimeline(); return; }
  if (!a) return;
  if (tl.playing && a.paused && !tl.loop) { tl.playing = false; $('tlPlay').textContent = '▶'; }   // a one-shot ran out
  if (tl.playing) $('tlScrub').value = a.time;
  $('tlRead').textContent = TL.readout(a.time, a.getClip().duration, tl.fps);
}

// ---- loop
function resize() { renderer.setSize(innerWidth, innerHeight); post?.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
// block double-tap / pinch page zoom on iOS
document.addEventListener('gesturestart', e => e.preventDefault());
let lastTouch = 0;
document.addEventListener('touchend', e => { const n = Date.now(); if (n - lastTouch < 300) e.preventDefault(); lastTouch = n; }, { passive: false });

await rebuild();
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  world.animate(dt, playing);
  tlTick();
  world.followFocus(orbit.target);
  if (playing) world.update(dt);
  const selObj = !playing && world.getEntity(selectedId)?.object3d;   // highlight what's selected
  if (selBox) { selBox.visible = !!selObj && (!selObj.isLight || !!selObj.userData.marker); if (selBox.visible) selBox.setFromObject(selObj); }
  orbit.update();
  if (post) post.render(); else renderer.render(world.scene, camera);
