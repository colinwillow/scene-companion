<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Scene Companion</title>
<style>
  :root { color-scheme: dark; --bg:#12161d; --panel:#1b212bee; --line:#2c3542; --text:#e8edf3; --dim:#8b97a6; --accent:#ff8a3d; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text);
    font: 14px/1.35 system-ui, -apple-system, sans-serif; overflow:hidden;
    touch-action: none; -webkit-user-select:none; user-select:none; overscroll-behavior:none; }
  canvas { display:block; position:fixed; inset:0; width:100%; height:100%; touch-action:none; }
  #bar { position:fixed; top:env(safe-area-inset-top); left:env(safe-area-inset-left); right:env(safe-area-inset-right); display:flex; gap:6px; padding:8px; flex-wrap:wrap; z-index:2; }
  #bar button, #bar select { background:var(--panel); color:var(--text); border:1px solid var(--line);
    border-radius:10px; padding:8px 11px; font:inherit; }
  #bar select { max-width:88px; }
  #bar button.on { background:var(--accent); color:#111; border-color:var(--accent); }
  #score { margin-left:auto; padding:8px 11px; background:var(--panel); border-radius:10px; }
  #panel { position:fixed; left:0; right:0; bottom:0; height:var(--sheet, 42vh); z-index:2; display:flex; flex-direction:column;
    background:var(--panel); border-top:1px solid var(--line); border-radius:16px 16px 0 0; transition:height .22s ease; }
  #panel.dragging { transition:none; }
  #grab { flex:none; height:26px; display:flex; align-items:center; justify-content:center; touch-action:none; cursor:grab; }
  #grab::before { content:''; width:44px; height:5px; border-radius:3px; background:var(--dim); opacity:.7; }
  #panelBody { flex:1; overflow:auto; padding:0 14px calc(14px + env(safe-area-inset-bottom));
    touch-action: pan-y; -webkit-user-select:text; user-select:text; overscroll-behavior:contain; }
  @media (orientation: landscape) and (min-width: 600px) {
    #panel { left:auto; top:0; height:auto; width:320px; border-top:none; border-radius:0; border-left:1px solid var(--line); padding-top:60px; }
    #grab { display:none; }
  }
  #panel h3 { margin:0 0 6px; font-size:15px; }
  #panel .hint { color:var(--dim); }
  .beh { border:1px solid var(--line); border-radius:10px; padding:8px 10px; margin:8px 0; }
  .beh b { display:block; margin-bottom:4px; color:var(--accent); }
  .row { display:flex; align-items:center; gap:8px; margin:5px 0; }
  .row label { width:92px; color:var(--dim); flex:none; }
  .row input[type=range] { flex:1; }
  .row input[type=number], .row input[type=text] { width:64px; background:#0e1218; color:var(--text);
    border:1px solid var(--line); border-radius:6px; padding:4px; font:inherit; }
  .row output { width:44px; text-align:right; }
  select.add { width:100%; margin-top:6px; padding:8px; background:#0e1218; color:var(--text); border:1px solid var(--line); border-radius:8px; }
  .acts { display:flex; gap:8px; margin:8px 0; }
  .acts button { flex:1; padding:9px; border-radius:9px; border:1px solid var(--line); background:#0e1218; color:var(--text); font:inherit; }
  #tree { position:fixed; z-index:2; left:0; right:0; top:calc(100px + env(safe-area-inset-top)); max-height:38vh; display:none; flex-direction:column;
    background:var(--panel); border-bottom:1px solid var(--line); padding:8px 10px; }
  #tree.open { display:flex; }
  #tree input { width:100%; padding:8px 10px; border-radius:8px; border:1px solid var(--line); background:#0e1218; color:var(--text); font:inherit; margin-bottom:6px; -webkit-user-select:text; user-select:text; }
  #tree ul { list-style:none; margin:0; padding:0; overflow:auto; touch-action:pan-y; flex:1; }
  #tree li { padding:9px 8px; border-radius:8px; display:flex; gap:8px; align-items:baseline; cursor:pointer; }
  #tree li.sel { background:var(--accent); color:#111; }
  #tree li.sel small { color:#111a; }
  #tree li small { color:var(--dim); font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #tree .count { color:var(--dim); font-size:12px; margin:0 0 4px 2px; }
  @media (orientation: landscape) and (min-width: 600px) {
    #tree { right:auto; width:260px; top:0; bottom:0; max-height:none; padding-top:60px; border-bottom:none; border-right:1px solid var(--line); }
  }
  #liveBadge { position:fixed; left:calc(8px + env(safe-area-inset-left)); bottom:calc(8px + env(safe-area-inset-bottom)); z-index:5; pointer-events:none;
    font:700 11px/1 system-ui, sans-serif; letter-spacing:.06em; color:#d6ffe0; background:#0b3d1fcc; border:1px solid #3ddc84aa; padding:4px 7px; border-radius:999px; transition:background .2s; }
  #liveBadge.flash { background:#3ddc84; color:#0b3d1f; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="bar">
  <button id="list" title="All objects">☰ List</button>
  <button id="play">▶ Play</button>
  <button id="mode" title="Gizmo mode">Move</button>
  <select id="look" title="Look profile"><option>toon</option><option>baked</option><option>pbr</option></select>
  <select id="tier" title="Quality tier"><option>web</option><option>desktop</option></select>
  <select id="add" title="Add an object"></select>
  <button id="undo" title="Undo (Ctrl+Z)" disabled>↶</button>
  <button id="redo" title="Redo (Ctrl+Shift+Z)" disabled>↷</button>
  <button id="save" title="Copy the scene JSON">Copy</button>
  <button id="push" title="Commit this scene to GitHub">⇪ Save</button>
  <span id="score">★ 0</span>
</div>
<div id="err" hidden style="position:fixed;left:8px;right:8px;top:calc(60px + env(safe-area-inset-top));z-index:3;background:#5a1d1d;color:#ffd9d9;border-radius:10px;padding:10px;font:12px/1.4 ui-monospace,monospace;white-space:pre-wrap"></div>
<div id="liveBadge" hidden>● LIVE</div>
<div id="tree"><input id="treeSearch" type="search" placeholder="Search id, prefab, asset, behavior…" autocomplete="off"><div class="count" id="treeCount"></div><ul id="treeList"></ul></div>
<div id="panel"><div id="grab" title="Drag or tap to resize"></div><div id="panelBody"><p class="hint">Tap an object to inspect it. Drag the gizmo to move it. Press Play to run the scene.</p></div></div>

<script>
// Show errors on screen so problems are visible on a phone.
function showErr(m){const e=document.getElementById('err');if(!e)return;e.hidden=false;e.textContent+=(e.textContent?'\n':'')+m;}
addEventListener('error',e=>showErr(e.message));
addEventListener('unhandledrejection',e=>showErr(String(e.reason?.message||e.reason)));
const _warn=console.warn;console.warn=(...a)=>{_warn(...a);showErr(a.join(' '));};
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { TransformControls } from 'three/addons/controls/TransformControls.js';
import { World } from './runtime/World.js';
import { getBehavior, behaviorNames } from './runtime/registry.js';
import { setOverride } from './runtime/prefabs.js';
import { addEntity, duplicateEntity, deleteEntity, setAsset } from './runtime/editing.js';
import { History } from './runtime/history.js';
import { saveFile } from './runtime/github.js';
import { createPost } from './runtime/post.js';
import { describeState, sameScene } from './runtime/livestate.js';
import { COMMANDS, runCommand } from './runtime/commands.js';
import { applyScene } from './runtime/livepatch.js';
import './behaviors/index.js';

const $ = id => document.getElementById(id);

// ---- the single source of truth: scene data
const SCENE_URL = new URLSearchParams(location.search).get('scene') || './scenes/kitchen-sink.scene.json';
let loadedText = await (await fetch(SCENE_URL)).text();   // what the repo had when we opened it
const data = JSON.parse(loadedText);

const renderer = new THREE.WebGLRenderer({ antialias: true });
document.body.prepend(renderer.domElement);
const camera = new THREE.PerspectiveCamera(55, 1, 0.1, 3000);
camera.position.set(10, 11, 14);
const orbit = new OrbitControls(camera, renderer.domElement);
orbit.target.set(0, 0.5, 0);
orbit.enableDamping = true;
// Touch: one finger pans (and taps select / drag the gizmo), two fingers orbit + pinch zoom.
const coarse = matchMedia('(pointer: coarse)').matches;
if (coarse) orbit.touches = { ONE: THREE.TOUCH.PAN, TWO: THREE.TOUCH.DOLLY_ROTATE };

// ---- bottom-sheet inspector (portrait): drag the handle, it snaps to peek / half / full; tap cycles.
const SNAPS = [0.11, 0.42, 0.85];          // fractions of the screen height
let sheet = 1;
function setSheet(i) { sheet = Math.max(0, Math.min(SNAPS.length - 1, i)); $('panel').style.setProperty('--sheet', SNAPS[sheet] * 100 + 'vh'); }
{
  const grab = $('grab'); let y0 = null, h0 = 0, cur = 0, moved = false;
  grab.addEventListener('pointerdown', e => { y0 = e.clientY; h0 = cur = SNAPS[sheet] * innerHeight; moved = false; grab.setPointerCapture(e.pointerId); $('panel').classList.add('dragging'); });
  grab.addEventListener('pointermove', e => {
    if (y0 === null) return;
    if (Math.abs(e.clientY - y0) > 6) moved = true;
    cur = Math.max(60, Math.min(innerHeight * 0.9, h0 + y0 - e.clientY));
    $('panel').style.setProperty('--sheet', cur + 'px');
  });
  const up = e => {
    if (y0 === null) return;
    $('panel').classList.remove('dragging');
    if (!moved) setSheet((sheet + 1) % SNAPS.length);
    else { const f = cur / innerHeight;
      setSheet(SNAPS.reduce((best, s, i) => Math.abs(s - f) < Math.abs(SNAPS[best] - f) ? i : best, 0)); }
    y0 = null;
  };
  grab.addEventListener('pointerup', up); grab.addEventListener('pointercancel', up);
}

let world, post, playing = false, selectedId = null, score = 0;
let gizmo;
$('look').value = data.settings.look || 'toon';

async function rebuild() {
  gizmo?.detach();
  world?.dispose();
  world = new World(renderer, { tier: $('tier').value });
  window.__sc = { world, data }; // debug/test hook (headless checks, future MCP)
  await world.load(data);
  world.on('score', p => { score += p; $('score').textContent = `★ ${score}`; });
  post?.dispose();
  post = createPost(renderer, world.scene, camera, data.settings.post, $('tier').value);
  gizmo = new TransformControls(camera, renderer.domElement);
  if (coarse) gizmo.setSize(1.6);                 // fatter handles for fingers
  gizmo.addEventListener('dragging-changed', e => { orbit.enabled = !e.value; if (e.value) record(); });
  gizmo.addEventListener('objectChange', syncTransformToData);
  world.scene.add(gizmo.getHelper());
  gizmo.setMode(['translate', 'rotate', 'scale'][modeIdx]);
  if (selectedId && !playing) select(selectedId);
  renderTree();
}

// ---- editor: write gizmo changes back into scene data
const r3 = v => Math.round(v * 1000) / 1000;
function syncTransformToData() {
  const ent = world.getEntity(selectedId); if (!ent) return;
  const o = ent.object3d, e = ent.data;
  e.position = o.position.toArray().map(r3);
  e.rotation = [o.rotation.x, o.rotation.y, o.rotation.z].map(r => r3(THREE.MathUtils.radToDeg(r)));
  e.scale = o.scale.toArray().map(r3);
  renderPanel();
}

function select(id) {
  selectedId = id;
  sendSelect?.();
  if (id && sheet === 0) setSheet(1);              // peeking sheet opens to show the inspector
  const ent = world.getEntity(id);
  if (ent && !ent.data.light && !playing) gizmo.attach(ent.object3d); else gizmo.detach();
  renderPanel();
  renderTree();
}

// ---- hierarchy: every entity, searchable; tap to select and frame it
function entityTags(e) {
  const r = e.resolved || e.data;
  const what = e.data.prefab ? `⧉ ${e.data.prefab}` : e.data.light ? `☀ ${e.data.light.type}` : typeof e.data.asset === 'string' ? e.data.asset : '';
  return [what, ...(r.behaviors || []).map(b => b.type)].filter(Boolean);
}
function renderTree() {
  if (!$('tree').classList.contains('open') || !world) return;
  const wide = matchMedia('(orientation: landscape) and (min-width: 600px)').matches;
  $('tree').style.top = wide ? '' : $('bar').getBoundingClientRect().bottom + 'px';   // sit under the toolbar
  const q = $('treeSearch').value.trim().toLowerCase();
  const all = [...world.entities.values()];
  const shown = all.filter(e => !q || [e.id, ...entityTags(e)].some(t => t.toLowerCase().includes(q)));
  $('treeCount').textContent = q ? `${shown.length} of ${all.length}` : `${all.length} objects`;
  const ul = $('treeList'); ul.innerHTML = '';
  for (const e of shown) {
    const li = document.createElement('li');
    li.className = e.id === selectedId ? 'sel' : '';
    li.innerHTML = `<span></span><small></small>`;
    li.firstChild.textContent = e.id;
    li.lastChild.textContent = entityTags(e).join(' · ');
    li.onclick = () => {
      select(e.id); frame(e.id);
      if (!wide) { $('tree').classList.remove('open'); $('list').classList.remove('on'); }   // phone portrait: give the view back
    };
    ul.append(li);
  }
  ul.querySelector('.sel')?.scrollIntoView({ block: 'nearest' });
}
// Move the orbit target to the object, keeping the camera's angle and distance.
function frame(id) {
  const o = world.getEntity(id)?.object3d; if (!o || o.isLight) return;
  const p = new THREE.Box3().setFromObject(o).getCenter(new THREE.Vector3());
  if (!isFinite(p.x)) o.getWorldPosition(p);
  camera.position.add(p.clone().sub(orbit.target));
  orbit.target.copy(p);
}
$('list').onclick = () => { $('tree').classList.toggle('open'); $('list').classList.toggle('on', $('tree').classList.contains('open')); renderTree(); };
$('treeSearch').oninput = renderTree;

// ---- inspector generated from behavior schemas
function control(def, value, onChange) {
  const row = document.createElement('div'); row.className = 'row';
  if (def.type === 'number') {
    row.innerHTML = `<input type="range" min="${def.min ?? 0}" max="${def.max ?? 10}" step="${def.step ?? 0.1}" value="${value}"><output>${value}</output>`;
    const [inp, out] = row.children;
    inp.oninput = () => { out.textContent = inp.value; onChange(+inp.value); };
  } else if (def.type === 'boolean') {
    row.innerHTML = `<input type="checkbox" ${value ? 'checked' : ''}>`;
    row.firstChild.onchange = e => onChange(e.target.checked);
  } else if (def.type === 'vec3') {
    value.forEach((v, i) => {
      const inp = document.createElement('input'); inp.type = 'number'; inp.step = '0.1'; inp.value = v;
      inp.onchange = () => { const nv = [...value]; nv[i] = +inp.value; value = nv; onChange(nv); };
      row.append(inp);
    });
  } else if (def.type === 'color') {
    row.innerHTML = `<input type="color" value="${value}">`;
    row.firstChild.oninput = e => onChange(e.target.value);
  } else {
    row.innerHTML = `<input type="text" value="${value}">`;
    row.firstChild.onchange = e => onChange(e.target.value);
  }
  return row;
}

function renderPanel() {
  const panel = $('panelBody');
  const ent = world?.getEntity(selectedId);
  if (!ent) { panel.innerHTML = `<p class="hint">Tap an object to inspect it. Drag the gizmo to move it. Press Play to run the scene.</p>`; return; }
  const e = ent.data;
  const label = e.prefab ? `prefab: ${e.prefab} (edits here override only this one)` : e.asset ? 'asset: ' + (typeof e.asset === 'string' ? e.asset : 'inline') : 'light';
  panel.innerHTML = `<h3>${e.id}</h3><div class="hint">${label}${playing ? ' · playing (edits apply live, reset on Stop)' : ''}</div><div class="hint" id="liveIn"></div>`;
  if (!playing) {
    const acts = document.createElement('div'); acts.className = 'acts';
    acts.innerHTML = `<button data-a="dup">⧉ Duplicate</button><button data-a="del">🗑 Delete</button>`;
    acts.onclick = async ev => {
      const a = ev.target.dataset.a; if (!a) return;
      if (a === 'dup') { record(); const c = duplicateEntity(data, e.id); await rebuild(); select(c.id); }
      if (a === 'del' && confirm(`Delete ${e.id}?`)) { record(); deleteEntity(data, e.id); selectedId = null; await rebuild(); renderPanel(); }
    };
    panel.append(acts);
    if (!e.light && data.assets && Object.keys(data.assets).length) {
      const row = document.createElement('div'); row.className = 'row';
      const cur = typeof e.asset === 'string' ? e.asset : '';
      row.innerHTML = `<label>model</label><select class="add" style="margin:0">${cur ? '' : `<option value="">${e.prefab ? 'from prefab' : 'inline'}</option>`}${Object.keys(data.assets).map(k => `<option ${k === cur ? 'selected' : ''}>${k}</option>`).join('')}</select>`;
      row.querySelector('select').onchange = async ev => { record(); if (setAsset(data, e.id, ev.target.value)) { await rebuild(); select(e.id); } };
      panel.append(row);
    }
  }
  const pos = document.createElement('div'); pos.className = 'row';
  pos.innerHTML = `<label>position</label>`;
  pos.append(...control({ type: 'vec3' }, e.position || [0, 0, 0], v => { record(`pos:${e.id}`); e.position = v; ent.object3d.position.fromArray(v); }).children);
  panel.append(pos);

  if (ent.anim) {
    const row = document.createElement('div'); row.className = 'row';
    row.innerHTML = `<label>animation</label><select class="add" style="margin:0">${ent.anim.clips.map(c => `<option ${c === (e.animation || ent.anim.current) ? 'selected' : ''}>${c}</option>`).join('')}</select>`;
    row.querySelector('select').onchange = ev => { record(); e.animation = ev.target.value; ent.anim.play(ev.target.value); };
    panel.append(row);
  }

  (ent.resolved.behaviors || []).forEach((b, i) => {
    const Cls = getBehavior(b.type);
    const box = document.createElement('div'); box.className = 'beh';
    box.innerHTML = `<b>${b.type}</b>`;
    if (!Cls) { box.innerHTML += `<div class="hint">unknown behavior</div>`; panel.append(box); return; }
    const params = { ...Object.fromEntries(Object.entries(Cls.schema).map(([k, d]) => [k, d.default])), ...(b.params || {}) };
    for (const [key, def] of Object.entries(Cls.schema)) {
      const row = control(def, params[key], v => {
        record(`param:${e.id}:${b.type}:${key}`);
        setOverride(e, b.type, key, v);                           // authored data (override if prefab)
        (b.params ||= {})[key] = v;
        ent.behaviors[i]?.onParamChanged(key, v);                 // live runtime
      });
      const lab = document.createElement('label'); lab.textContent = key; row.prepend(lab);
      box.append(row);
    }
    panel.append(box);
  });

  if (!playing) {
    const add = document.createElement('select'); add.className = 'add';
    add.innerHTML = `<option value="">+ Add behavior…</option>` + behaviorNames().map(n => `<option>${n}</option>`).join('');
    add.onchange = async () => { if (!add.value) return; record(); (e.behaviors ||= []).push({ type: add.value, params: {} }); await rebuild(); };
    panel.append(add);
  }
}

// ---- tapping: select in edit mode, move the player in play mode
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
let downAt = null;
renderer.domElement.addEventListener('pointerdown', e => (downAt = [e.clientX, e.clientY]));
renderer.domElement.addEventListener('pointerup', e => {
  if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 8 || gizmo.dragging) return;
  ptr.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ptr, camera);
  const hits = ray.intersectObjects(world.scene.children, true).filter(h => h.object.visible && !isGizmo(h.object));
  if (playing) {
    const g = hits.find(h => h.point.y < 0.3 && entityIdOf(h.object) !== 'player');   // any floor surface
    if (g) world.emit('moveTo', g.point.toArray());
    return;
  }
  const id = hits.length ? entityIdOf(hits[0].object) : null;
  select(id);
});
const isGizmo = o => { while (o) { if (o.isTransformControlsRoot || o.type === 'TransformControlsGizmo' || o.type === 'TransformControlsPlane') return true; o = o.parent; } return false; };
const entityIdOf = o => { while (o) { if (o.userData.entityId) return o.userData.entityId; o = o.parent; } return null; };

// ---- toolbar
$('play').onclick = async () => {
  playing = !playing;
  $('play').textContent = playing ? '■ Stop' : '▶ Play';
  $('play').classList.toggle('on', playing);
  $('add').disabled = playing;
  $('undo').disabled = playing || !hist.canUndo; $('redo').disabled = playing || !hist.canRedo;
  score = 0; $('score').textContent = '★ 0';
  await rebuild();                       // Play and Stop both rebuild from authored data
  renderPanel();
};
let modeIdx = 0;
$('mode').onclick = () => { modeIdx = (modeIdx + 1) % 3; $('mode').textContent = ['Move', 'Rotate', 'Scale'][modeIdx]; gizmo.setMode(['translate', 'rotate', 'scale'][modeIdx]); };
$('look').onchange = async () => { record(); data.settings.look = $('look').value; await rebuild(); };
$('tier').onchange = rebuild;
// ---- save to GitHub (fine-grained token with Contents read/write, kept on this device only)
function ghSettings(reset) {
  let cfg = null;
  try { cfg = reset ? null : JSON.parse(localStorage.getItem('sc.github') || 'null'); } catch {}
  if (cfg?.token && cfg?.repo) return cfg;
  const repo = prompt('GitHub repo (owner/name):', cfg?.repo || 'colinwillow/scene-companion'); if (!repo) return null;
  const branch = prompt('Branch:', cfg?.branch || 'main') || 'main';
  const token = prompt('Fine-grained GitHub token (Contents: read & write on that repo). Stored only on this device.'); if (!token) return null;
  cfg = { repo: repo.trim(), branch: branch.trim(), token: token.trim() };
  try { localStorage.setItem('sc.github', JSON.stringify(cfg)); } catch {}
  return cfg;
}
$('push').onclick = async () => {
  const cfg = ghSettings(); if (!cfg) return;
  const path = new URL(SCENE_URL, location.href).pathname.replace(/^.*?(scenes\/)/, '$1');
  const text = JSON.stringify(data, null, 2) + '\n';
  const btn = $('push'); btn.textContent = 'Saving…'; btn.disabled = true;
  try {
    let r = await saveFile({ ...cfg, path, text, expectText: loadedText, message: `Edit ${path.split('/').pop()} in Scene Companion` });
    if (r.conflict && confirm(`${path} changed on GitHub since you opened it (maybe Claude pushed). Overwrite it with your version?`))
      r = await saveFile({ ...cfg, path, text, force: true, message: `Edit ${path.split('/').pop()} in Scene Companion` });
    if (r.saved || r.unchanged) { loadedText = text; btn.textContent = r.saved ? 'Saved ✓' : 'No changes'; }
    else btn.textContent = 'Not saved';
  } catch (e) {
    btn.textContent = 'Save failed';
    showErr(e.message);
    if (/\b(401|403)\b/.test(e.message)) try { localStorage.removeItem('sc.github'); } catch {}   // ask for a new token next time
  }
  btn.disabled = false;
  setTimeout(() => (btn.textContent = '⇪ Save'), 2000);
};

function flashLive() { const b = $('liveBadge'); b.classList.add('flash'); clearTimeout(flashLive.t); flashLive.t = setTimeout(() => b.classList.remove('flash'), 300); }
// ---- live link: when served by `npm run dev`, every edit is sent to running games (play.html) to hot-patch,
// the selection is shown in the game, and games report back FPS, errors and the selected object's live position.
var sendSelect;
{
  let ws, lastSent = '', gameErrors = 0, stale;
  sendSelect = () => { if (ws?.readyState === 1) ws.send(JSON.stringify({ type: 'select', url: SCENE_URL, id: selectedId })); };
  const connect = () => {
    try { ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/live`); } catch { return; }
    ws.onopen = () => { lastSent = ''; $('play').title = 'Live link on'; $('liveBadge').hidden = false; $('liveBadge').textContent = describeState(null); sendSelect(); };
    ws.onclose = () => { $('liveBadge').hidden = true; setTimeout(connect, 3000); };
    ws.onmessage = ev => {
      let s; try { s = JSON.parse(ev.data); } catch { return; }
      if (s.type === 'cmd' && (!s.scene || sameScene(s.scene, SCENE_URL))) {      // from the MCP server
        editorCommand(s.op, s.args || {}).then(
          r => ws.send(JSON.stringify({ type: 'cmd-result', id: s.id, ok: true, ...r })),
          e => ws.send(JSON.stringify({ type: 'cmd-result', id: s.id, ok: false, error: e.message })));
        return;
      }
      if (s.type !== 'state' || !sameScene(s.url, SCENE_URL)) return;
      for (const m of s.errors || []) { gameErrors++; showErr('[game] ' + m); }
      $('liveBadge').textContent = describeState(s, gameErrors);
      clearTimeout(stale); stale = setTimeout(() => { $('liveBadge').textContent = describeState(null); }, 2000);   // game closed
      const li = $('liveIn');
      if (li) li.textContent = s.selected && s.selected.id === selectedId
        ? `in game: ${s.selected.position.map(v => v.toFixed(2)).join(', ')}${s.selected.visible ? '' : ' · hidden'}` : '';
    };
  };
  if (location.protocol.startsWith('http') && new URLSearchParams(location.search).get('live') !== '0') connect();
  setInterval(() => {
    if (ws?.readyState !== 1) return;
    const text = JSON.stringify({ type: 'scene', url: SCENE_URL, data });
    if (text !== lastSent) { ws.send(text); lastSent = text; flashLive(); }
  }, 250);
}

// ---- commands from Claude (MCP server → dev server → here). Scene edits go through runtime/commands.js,
// are undoable like any other edit, and show up on screen (and in live games) immediately.
async function editorCommand(op, args) {
  if (COMMANDS[op]) {
    const ctx = { schemas: Object.fromEntries(behaviorNames().map(n => [n, getBehavior(n).schema])), prefabs: world.prefabs };
    if (COMMANDS[op].mutates && playing) throw new Error('Stop play mode first (use the stop tool) — edits made while playing are thrown away.');
    const before = structuredClone(data);
    const { result, changed } = runCommand(data, op, args, ctx);
    if (changed) {
      hist.record(before); updateUndo();
      if (selectedId && !data.entities.some(e => e.id === selectedId)) selectedId = null;
      if (applyScene(world, before, data) === 'rebuild') await rebuild();   // moves / params patch in place (fast)
      renderPanel();
    }
    return { result };
  }
  switch (op) {
    case 'get_selection': return { result: selectedId ? runCommand(data, 'get_entity', { id: selectedId }, { prefabs: world.prefabs }).result : null };
    case 'select':
      if (args.id && !world.getEntity(args.id)) throw new Error(`No entity "${args.id}"`);
      select(args.id || null); if (args.id) frame(args.id);
      return { result: { selected: selectedId } };
    case 'play': case 'stop':
      if ((op === 'play') !== playing) await $('play').onclick();
      if (op === 'play' && args.seconds) await new Promise(r => setTimeout(r, Math.min(10, args.seconds) * 1000));
      return { result: { playing } };
    case 'screenshot': {
      const max = Math.min(1024, args.maxSize || 768);
      if (post) post.render(); else renderer.render(world.scene, camera);       // draw now so the buffer is fresh
      const src = renderer.domElement, k = Math.min(1, max / Math.max(src.width, src.height));
      const c = document.createElement('canvas'); c.width = Math.round(src.width * k); c.height = Math.round(src.height * k);
      c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
      return { result: { width: c.width, height: c.height, playing, selected: selectedId }, image: c.toDataURL('image/jpeg', 0.8).split(',')[1], mime: 'image/jpeg' };
    }
    case 'read_errors': {
      const box = $('err'), errors = box.textContent ? box.textContent.split('\n') : [];
      if (args.clear) { box.textContent = ''; box.hidden = true; }
      return { result: { errors } };
    }
    case 'get_scene': return { result: { url: SCENE_URL, data } };
    default: throw new Error(`Unknown command "${op}"`);
  }
}

// ---- undo / redo (whole-scene snapshots; sliders coalesce into one step)
const hist = new History();
function record(key) { hist.record(data, key); updateUndo(); }
function updateUndo() { $('undo').disabled = !hist.canUndo; $('redo').disabled = !hist.canRedo; }
async function travel(dir) {
  if (playing) return;
  if (!(dir < 0 ? hist.undo(data) : hist.redo(data))) return;
  $('look').value = data.settings?.look || 'toon';
  updateUndo();
  if (selectedId && !data.entities.some(e => e.id === selectedId)) selectedId = null;
  await rebuild(); renderPanel();
}
$('undo').onclick = () => travel(-1);
$('redo').onclick = () => travel(1);
addEventListener('keydown', e => {
  if (!(e.ctrlKey || e.metaKey) || e.target.closest?.('input, select, textarea')) return;
  const k = e.key.toLowerCase();
  if (k === 'z') { e.preventDefault(); travel(e.shiftKey ? 1 : -1); }
  else if (k === 'y') { e.preventDefault(); travel(1); }
});
// Add: any prefab or scene asset, dropped where the camera is looking (on the floor).
function fillAdd() {
  const pf = Object.keys(data.prefabs || {}), as = Object.keys(data.assets || {});
  $('add').innerHTML = `<option value="">＋ Add</option>` +
    (pf.length ? `<optgroup label="Prefabs">${pf.map(n => `<option value="prefab:${n}">${n}</option>`).join('')}</optgroup>` : '') +
    (as.length ? `<optgroup label="Models">${as.map(n => `<option value="asset:${n}">${n}</option>`).join('')}</optgroup>` : '');
}
fillAdd();
$('add').onchange = async () => {
  const [kind, name] = $('add').value.split(':'); $('add').value = '';
  if (!name) return;
  if (playing) return;                                 // adding is an edit-mode thing
  const t = orbit.target;
  record();
  const e = addEntity(data, { [kind]: name }, [t.x, 0, t.z]);
  await rebuild(); select(e.id);
};
$('save').onclick = async () => {
  const json = JSON.stringify(data, null, 2);
  try { await navigator.clipboard.writeText(json); $('save').textContent = 'Copied ✓'; }
  catch { const blob = new Blob([json], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = SCENE_URL.split('/').pop(); a.click(); $('save').textContent = 'Saved ✓'; }
  setTimeout(() => ($('save').textContent = 'Copy'), 1500);
};

// ---- loop
function resize() { renderer.setSize(innerWidth, innerHeight); post?.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
// block double-tap / pinch page zoom on iOS
document.addEventListener('gesturestart', e => e.preventDefault());
let lastTouch = 0;
document.addEventListener('touchend', e => { const n = Date.now(); if (n - lastTouch < 300) e.preventDefault(); lastTouch = n; }, { passive: false });

await rebuild();
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  world.animate(dt);
  world.followFocus(orbit.target);
  if (playing) world.update(dt);
  orbit.update();
  if (post) post.render(); else renderer.render(world.scene, camera);
});
</script>
</body>
</html>
