<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Scene Companion</title>
<style>
  :root { color-scheme: dark; --bg:#12161d; --panel:#1b212bee; --line:#2c3542; --text:#e8edf3; --dim:#8b97a6; --accent:#ff8a3d; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text);
    font: 14px/1.35 system-ui, -apple-system, sans-serif; overflow:hidden;
    touch-action: none; -webkit-user-select:none; user-select:none; overscroll-behavior:none; }
  canvas { display:block; position:fixed; inset:0; width:100%; height:100%; touch-action:none; }
  #bar { position:fixed; top:env(safe-area-inset-top); left:env(safe-area-inset-left); right:env(safe-area-inset-right); display:flex; gap:6px; padding:8px; flex-wrap:wrap; z-index:2; }
  #bar button, #bar select { background:var(--panel); color:var(--text); border:1px solid var(--line);
    border-radius:10px; padding:8px 11px; font:inherit; }
  #bar select { max-width:88px; }
  #bar button.on { background:var(--accent); color:#111; border-color:var(--accent); }
  #score { margin-left:auto; padding:8px 11px; background:var(--panel); border-radius:10px; }
  #panel { position:fixed; left:0; right:0; bottom:0; height:var(--sheet, 42vh); z-index:2; display:flex; flex-direction:column;
    background:var(--panel); border-top:1px solid var(--line); border-radius:16px 16px 0 0; transition:height .22s ease; }
  #panel.dragging { transition:none; }
  #grab { flex:none; height:26px; display:flex; align-items:center; justify-content:center; touch-action:none; cursor:grab; }
  #grab::before { content:''; width:44px; height:5px; border-radius:3px; background:var(--dim); opacity:.7; }
  #panelBody { flex:1; overflow:auto; padding:0 14px calc(14px + env(safe-area-inset-bottom));
    touch-action: pan-y; -webkit-user-select:text; user-select:text; overscroll-behavior:contain; }
  #panel.closed { display:none; }
  #chip { position:fixed; z-index:3; left:0; right:0; margin:0 auto; width:max-content; bottom:calc(14px + env(safe-area-inset-bottom)); display:flex; align-items:center; gap:4px;
    max-width:calc(100vw - 150px); background:var(--panel); border:1px solid var(--accent); border-radius:999px; padding:4px 4px 4px 12px; }
  #chip[hidden] { display:none; }
  #chip span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:600; }
  #chip button { flex:none; background:#0e1218; color:var(--text); border:1px solid var(--line); border-radius:999px; padding:7px 11px; font:inherit; }
  #chip #chipEdit { background:var(--accent); color:#111; border-color:var(--accent); }
  @media (orientation: landscape) and (min-width: 600px) {
    #panel.closed { display:flex; }
    #chip { display:none !important; }
    #panel { left:auto; top:0; height:auto; width:320px; border-top:none; border-radius:0; border-left:1px solid var(--line); padding-top:60px; }
    #grab { display:none; }
  }
  #panel h3 { margin:0 0 6px; font-size:15px; }
  #panel .hint { color:var(--dim); }
  .beh { border:1px solid var(--line); border-radius:10px; padding:8px 10px; margin:8px 0; }
  .beh b { display:block; margin-bottom:4px; color:var(--accent); }
  .row { display:flex; align-items:center; gap:8px; margin:5px 0; }
  .row label { width:92px; color:var(--dim); flex:none; }
  .row input[type=range] { flex:1; }
  .row input[type=number], .row input[type=text] { width:64px; background:#0e1218; color:var(--text);
    border:1px solid var(--line); border-radius:6px; padding:4px; font:inherit; }
  .row output { width:44px; text-align:right; }
  select.add { width:100%; margin-top:6px; padding:8px; background:#0e1218; color:var(--text); border:1px solid var(--line); border-radius:8px; }
  .acts { display:flex; gap:8px; margin:8px 0; }
  .parentRow { display:flex; gap:8px; align-items:center; margin:0 0 8px; color:var(--dim); font-size:13px; }
  .parentRow select { flex:1; padding:7px; border-radius:8px; border:1px solid var(--line); background:#0e1218; color:var(--text); font:inherit; }
  .acts button { flex:1; padding:9px; border-radius:9px; border:1px solid var(--line); background:#0e1218; color:var(--text); font:inherit; }
  #lib .tabs { display:flex; gap:6px; margin-bottom:6px; }
  #lib .tabs button { flex:1; padding:7px; border-radius:8px; border:1px solid var(--line); background:#0e1218; color:var(--text); font:inherit; }
  #lib .tabs button.on { background:var(--accent); color:#111; }
  #tree, #lib { position:fixed; z-index:2; left:0; right:0; top:calc(100px + env(safe-area-inset-top)); max-height:38vh; display:none; flex-direction:column;
    background:var(--panel); border-bottom:1px solid var(--line); padding:8px 10px; }
  #tree.open, #lib.open { display:flex; }
  #tree input, #lib input { width:100%; padding:8px 10px; border-radius:8px; border:1px solid var(--line); background:#0e1218; color:var(--text); font:inherit; margin-bottom:6px; -webkit-user-select:text; user-select:text; }
  #tree ul, #lib ul { list-style:none; margin:0; padding:0; overflow:auto; touch-action:pan-y; flex:1; }
  #tree li, #lib li { padding:9px 8px; border-radius:8px; display:flex; gap:8px; align-items:baseline; cursor:pointer; }
  #tree li.sel { background:var(--accent); color:#111; }
  #lib li.thumb { align-items:center; padding:5px 8px; }
  #lib li img { width:44px; height:44px; flex:none; border-radius:9px; background:#262e40; object-fit:contain; }
  #lib li.locked { opacity:.45; cursor:not-allowed; }
  #lib li .packbtn { margin-left:auto; padding:4px 10px; border-radius:7px; border:1px solid var(--line); background:#0e1218; color:var(--text); font:inherit; font-size:12px; font-weight:400; }
  #lib li.head { cursor:default; font-weight:700; padding-top:12px; border-bottom:1px solid var(--line); border-radius:0; }
  #tree li.sel small { color:#111a; }
  #tree li.dragging { opacity:.55; outline:2px dashed var(--accent); }
  #treeList.dragmode { touch-action:none; }
  #tree li.drop { outline:2px solid var(--accent); background:#ffffff14; }
  #treeCount.drop { color:var(--accent); font-weight:700; }
  #tree li small, #lib li small { color:var(--dim); font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #tree .count, #lib .count { color:var(--dim); font-size:12px; margin:0 0 4px 2px; }
  @media (orientation: landscape) and (min-width: 600px) {
    #tree, #lib { right:auto; width:260px; top:0; bottom:0; max-height:none; padding-top:60px; border-bottom:none; border-right:1px solid var(--line); }
  }
  #scatterBar { position:fixed; z-index:3; left:0; right:0; margin:0 auto; width:max-content; max-width:calc(100vw - 24px); bottom:calc(14px + env(safe-area-inset-bottom));
    display:flex; gap:6px; align-items:center; flex-wrap:wrap; justify-content:center; background:var(--panel); border:1px solid #3ddc84; border-radius:14px; padding:6px 8px; }
  #scatterBar[hidden] { display:none; }
  #scatterBar select { background:#0e1218; color:var(--text); border:1px solid var(--line); border-radius:8px; padding:6px; font:inherit; max-width:150px; }
  #scatterBar small { color:var(--dim); }
  #scatterBar label { display:flex; gap:4px; align-items:center; }
  #scatterBar input[type=range] { width:84px; accent-color:#3ddc84; }
  #scatterBar.erase { border-color:#ff5d5d; }
  #scatterBar.erase input[type=range] { accent-color:#ff5d5d; }
  .rules { display:flex; flex-direction:column; gap:6px; width:100%; }
  .rule { border:1px solid var(--line); border-radius:8px; padding:6px; display:flex; flex-direction:column; gap:4px; }
  .ruleRow { display:flex; flex-wrap:wrap; align-items:center; gap:6px; font-size:12px; }
  .ruleRow b { min-width:34px; color:var(--dim); }
  .ruleRow input[type=number] { width:58px; } .ruleRow input[type=text] { width:96px; }
  .ruleFields { display:contents; } .ruleFields label { display:flex; gap:3px; align-items:center; color:var(--dim); }
  .ruleAdd { align-self:flex-start; font-size:12px; }
  .graphBox { overflow:auto; max-height:40vh; border:1px solid var(--line); border-radius:8px; padding:4px; }
  .rulegraph .n { fill:#1a2230; stroke:var(--line); } .rulegraph .when { stroke:#5ab0ff; } .rulegraph .if { stroke:#f5c04a; } .rulegraph .do { stroke:#3ddc84; }
  .rulegraph .t { fill:var(--text); font:700 12px system-ui,sans-serif; } .rulegraph .s { fill:var(--dim); font:10px system-ui,sans-serif; }
  .rulegraph .w { fill:none; stroke:var(--dim); stroke-width:1.5; }
  #liveBadge { position:fixed; left:calc(8px + env(safe-area-inset-left)); bottom:calc(8px + env(safe-area-inset-bottom)); z-index:5; pointer-events:none;
    font:700 11px/1 system-ui, sans-serif; letter-spacing:.06em; color:#d6ffe0; background:#0b3d1fcc; border:1px solid #3ddc84aa; padding:4px 7px; border-radius:999px; transition:background .2s; }
  #liveBadge.flash { background:#3ddc84; color:#0b3d1f; }
</style>

<body>
<div id="bar">
  <button id="list" title="All objects">☰ List</button>
  <button id="libBtn" title="Libraries: characters, props, motions">📚 Library</button>
  <button id="play">▶ Play</button>
  <button id="mode" title="Gizmo mode">Move</button>
 <button id="scatter" title="Scatter brush: drag on the ground to paint a prefab (trees, rocks, grass)">🖌 Scatter</button>
  <button id="snap" title="Grid snap: 0.5 m moves, 15° turns, 0.25 scale steps">▦ Snap</button>
  <select id="look" title="Look profile"><option>toon</option><option>baked</option><option>pbr</option></select>

  <button id="undo" title="Undo (Ctrl+Z)" disabled>↶</button>
  <button id="redo" title="Redo (Ctrl+Shift+Z)" disabled>↷</button>

</div>
<div id="err" hidden style="position:fixed;left:8px;right:8px;top:calc(60px + env(safe-area-inset-top));z-index:3;background:#5a1d1d;color:#ffd9d9;border-radius:10px;padding:10px;font:12px/1.4 ui-monospace,monospace;white-space:pre-wrap"></div>
<div id="liveBadge" hidden>● LIVE</div>
<div id="tree"><input id="treeSearch" type="search" placeholder="Search id, prefab, asset, behavior…" autocomplete="off"><div class="count" id="treeCount"></div><ul id="treeList"></ul></div>
<div id="lib"><div class="tabs"><button data-t="characters" class="on">Characters</button><button data-t="props">Props</button><button data-t="kit">Level kit</button><button data-t="packs">Packs</button><button data-t="motions">Motions</button><button data-t="vars">Variables</button></div><input id="libSearch" type="search" placeholder="Search…" autocomplete="off"><div class="count" id="libCount"></div><ul id="libList"></ul></div>
<div id="scatterBar" hidden><select id="scPrefab" title="What to paint"></select><button id="scMode" title="Paint or erase instances of this prefab">🖌 Paint</button><label title="Spacing between instances (lower = denser)"><small>gap</small><input id="scSpacing" type="range" min="0.5" max="6" step="0.25" value="1.5"><small id="scSpacingV">1.5 m</small></label><label title="Jitter: random turn + size variety (0 = all the same)"><small>jitter</small><input id="scJitter" type="range" min="0" max="1" step="0.1" value="0.4"></label><small id="scHint">1 finger paints · 2 fingers orbit</small></div>
<div id="chip" hidden><span id="chipName"></span><button id="chipEdit" title="Open the inspector">✎ Edit</button><button id="chipX" title="Deselect">✕</button></div>
<div id="panel" class="closed"><div id="grab" title="Drag or tap to resize"></div><div id="panelBody"><p class="hint">Tap an object to inspect it. Drag the gizmo to move it. Press Play to run the scene.</p></div></div>

<script>
// Show errors on screen so problems are visible on a phone.
function showErr(m){const e=document.getElementById('err');if(!e)return;e.hidden=false;e.textContent+=(e.textContent?'\n':'')+m;}
addEventListener('error',e=>showErr(e.message));
addEventListener('unhandledrejection',e=>showErr(String(e.reason?.message||e.reason)));
const _warn=console.warn;console.warn=(...a)=>{_warn(...a);showErr(a.join(' '));};
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { TransformControls } from 'three/addons/controls/TransformControls.js';
import { World } from './runtime/World.js';
import { getBehavior, behaviorNames } from './runtime/registry.js';
import { setOverride } from './runtime/prefabs.js';
import { addEntity, duplicateEntity, deleteEntity, setAsset, modelPath, replaceModel, isDropSurface, dropPoint, isGround, snapXZ, GRID, addLight, setLightValue, LIGHT_FIELDS, scatterPoints, scatterEntity, jitterOptions, scatterEraseIds, eraseRadius, addCharacter } from './runtime/editing.js';
import { clipRoles, characterEntries } from './runtime/character.js';
import { libraryPacks, setInstalled, parseUnlocks, libraryFilter } from './runtime/packs.js';
import { findEntity, allEntities, descendantIds, reparent } from './runtime/tree.js';
import { libraryGroups, filterNames } from './runtime/library.js';
import { searchMotions, addMotion, motionsBase } from './runtime/motions.js';
import * as RX from './runtime/reactions.js';
import { History } from './runtime/history.js';
import { saveFile } from './runtime/github.js';
import { createPost } from './runtime/post.js';
import { describeState, sameScene } from './runtime/livestate.js';
import { COMMANDS, runCommand } from './runtime/commands.js';
import { applyScene, patchScene } from './runtime/livepatch.js';
import './behaviors/index.js';

const $ = id => document.getElementById(id);

// ---- the single source of truth: scene data
const SCENE_URL = new URLSearchParams(location.search).get('scene') || './scenes/kitchen-sink.scene.json';
let loadedText = await (await fetch(SCENE_URL)).text();   // what the repo had when we opened it
const data = JSON.parse(loadedText);

const renderer = new THREE.WebGLRenderer({ antialias: true });
document.body.prepend(renderer.domElement);
const camera = new THREE.PerspectiveCamera(55, 1, 0.1, 3000);
camera.position.set(10, 11, 14);
const orbit = new OrbitControls(camera, renderer.domElement);
orbit.target.set(0, 0.5, 0);
orbit.enableDamping = true;
// Touch: one finger pans (and taps select / drag the gizmo), two fingers orbit + pinch zoom.
const coarse = matchMedia('(pointer: coarse)').matches;
if (coarse) orbit.touches = { ONE: THREE.TOUCH.PAN, TWO: THREE.TOUCH.DOLLY_ROTATE };

// ---- bottom-sheet inspector (portrait): drag the handle, it snaps to peek / half / full; tap cycles.
const SNAPS = [0.11, 0.42, 0.85];          // fractions of the screen height
let sheet = 1;
function setSheet(i) { sheet = Math.max(0, Math.min(SNAPS.length - 1, i)); $('panel').style.setProperty('--sheet', SNAPS[sheet] * 100 + 'vh'); openSheet(true); }
// Phones (portrait): the inspector starts closed and selecting doesn't open it — a name chip does (✎ Edit).
// Landscape keeps its side panel. Closing: drag the handle down to the bottom, or tap it when full.
const wideNow = () => matchMedia('(orientation: landscape) and (min-width: 600px)').matches;
function openSheet(open) { $('panel').classList.toggle('closed', !open); updateChip(); }
function updateChip() {
  const show = !!selectedId && $('panel').classList.contains('closed');
  $('chip').hidden = !show;
  if (show) $('chipName').textContent = selectedId;
}
{
  const grab = $('grab'); let y0 = null, h0 = 0, cur = 0, moved = false;
  grab.addEventListener('pointerdown', e => { y0 = e.clientY; h0 = cur = SNAPS[sheet] * innerHeight; moved = false; grab.setPointerCapture(e.pointerId); $('panel').classList.add('dragging'); });
  grab.addEventListener('pointermove', e => {
    if (y0 === null) return;
    if (Math.abs(e.clientY - y0) > 6) moved = true;
    cur = Math.max(30, Math.min(innerHeight * 0.9, h0 + y0 - e.clientY));
    $('panel').style.setProperty('--sheet', cur + 'px');
  });
  const up = e => {
    if (y0 === null) return;
    $('panel').classList.remove('dragging');
    if (!moved) { if (sheet === SNAPS.length - 1) openSheet(false); else setSheet(sheet + 1); }
    else if (cur < innerHeight * 0.08) openSheet(false);
    else { const f = cur / innerHeight;
      setSheet(SNAPS.reduce((best, s, i) => Math.abs(s - f) < Math.abs(SNAPS[best] - f) ? i : best, 0)); }
    y0 = null;
  };
  grab.addEventListener('pointerup', up); grab.addEventListener('pointercancel', up);
}

let world, post, playing = false, selectedId = null, score = 0;
let gizmo, selBox;
$('look').value = data.settings.look || 'toon';

async function rebuild() {
  gizmo?.detach();
  world?.dispose();
  world = new World(renderer, { tier: $('tier').value });
  window.__sc = { world, data, camera, orbit, rebuild }; // debug/test hook (headless checks, timing)
  await world.load(data);
  world.on('score', p => { score += p; $('score').textContent = `★ ${score}`; });
  post?.dispose();
  post = createPost(renderer, world.scene, camera, data.settings.post, $('tier').value);
  gizmo = new TransformControls(camera, renderer.domElement);
  if (coarse) gizmo.setSize(1.6);                 // fatter handles for fingers
  gizmo.addEventListener('dragging-changed', e => { orbit.enabled = !e.value; if (e.value) record(); });
  gizmo.addEventListener('objectChange', syncTransformToData);
  world.scene.add(gizmo.getHelper());
  gizmo.setMode(['translate', 'rotate', 'scale'][modeIdx]);
  applySnap();
  // Lights are invisible: give point / spot lights a small glowing marker so they can be tapped and dragged.
  for (const ent of world.entities.values()) {
    const t = ent.data.light?.type;
    if (!['point', 'spot'].includes(t)) continue;           // the sun follows the camera focus (shadows), so it isn't draggable
    const m = new THREE.Mesh(   // sc:overlay (editor-only light marker)
      t === 'spot' ? new THREE.ConeGeometry(0.22, 0.4, 12).translate(0, -0.1, 0) : new THREE.SphereGeometry(0.2, 12, 8),
      new THREE.MeshBasicMaterial({ color: ent.data.light.color || '#ffffff', toneMapped: false, fog: false }));
    m.castShadow = false; ent.object3d.add(m); ent.object3d.userData.marker = m;   // sc:overlay (editor only)
  }
  selBox = new THREE.BoxHelper(undefined, 0xff8a3d); selBox.raycast = () => {}; selBox.visible = false;   // sc:overlay
  selBox.material.depthTest = false; selBox.renderOrder = 999;
  world.scene.add(selBox);
  if (selectedId && !playing) select(selectedId);
  renderTree();
}

// ---- editor: write gizmo changes back into scene data
const r3 = v => Math.round(v * 1000) / 1000;
function syncTransformToData() {
  const ent = world.getEntity(selectedId); if (!ent) return;
  const o = ent.object3d, e = ent.data;
  e.position = o.position.toArray().map(r3);
  e.rotation = [o.rotation.x, o.rotation.y, o.rotation.z].map(r => r3(THREE.MathUtils.radToDeg(r)));
  e.scale = o.scale.toArray().map(r3);
  renderPanel();
}

function select(id) {
  selectedId = id;
  sendSelect?.();
  if (!id && !wideNow()) openSheet(false);         // deselecting gives the view back on phones
  updateChip();
  const ent = world.getEntity(id);
  if (ent && (!ent.data.light || ent.object3d.userData.marker) && !playing) gizmo?.attach(ent.object3d); else gizmo?.detach();   // gizmo is made at the end of the first rebuild
  renderPanel();
  renderTree();
  if (libTab === 'motions') renderLib();
}

// ---- hierarchy: every entity, searchable; tap to select and frame it
function entityTags(e) {
  const r = e.resolved || e.data;
  const what = e.data.prefab ? `⧉ ${e.data.prefab}` : e.data.light ? `☀ ${e.data.light.type}` : typeof e.data.asset === 'string' ? e.data.asset : '';
  return [what, ...(r.behaviors || []).map(b => b.type), ...(e.tags || []).map(t => `#${t}`), ...(e.inherited ? ['from prefab'] : [])].filter(Boolean);
}
function renderTree() {
  if (!$('tree').classList.contains('open') || !world) return;
  const wide = matchMedia('(orientation: landscape) and (min-width: 600px)').matches;
  $('tree').style.top = wide ? '' : $('bar').getBoundingClientRect().bottom + 'px';   // sit under the toolbar
  const q = $('treeSearch').value.trim().toLowerCase();
  const all = [...world.entities.values()];
  const shown = all.filter(e => !q || [e.id, ...entityTags(e)].some(t => t.toLowerCase().includes(q)));
  $('treeCount').textContent = q ? `${shown.length} of ${all.length}` : `${all.length} objects`;
  const ul = $('treeList'); ul.innerHTML = '';
  for (const e of shown) {
    const li = document.createElement('li');
    li.className = e.id === selectedId ? 'sel' : '';
    li.innerHTML = `<span></span><small></small>`;
    li.firstChild.textContent = (e.depth ? '↳ ' : '') + e.id;
    if (e.depth) li.style.paddingLeft = `${8 + e.depth * 16}px`;   // children sit under their parent (they move with it)
    li.lastChild.textContent = entityTags(e).join(' · ');
    li.dataset.id = e.id;
    if (!e.inherited && !e.data?.light) li.onpointerdown = ev => treeDragStart(ev, li, e.id);
    li.onclick = () => {
      if (treeDrag.justDropped) return;
      let id = e.id; while (world.getEntity(id)?.inherited) id = world.getEntity(id).parent;   // prefab children belong to the prefab file
      select(id); frame(id);
      if (!wide) { $('tree').classList.remove('open'); $('list').classList.remove('on'); }   // phone portrait: give the view back
    };
    ul.append(li);
  }
  ul.querySelector('.sel')?.scrollIntoView({ block: 'nearest' });
}
// ☰ List drag to re-parent: long-press a row (works with a thumb — HTML drag-and-drop doesn't on iOS), drag it onto
// another row to nest it there, or onto the count strip at the top to make it top level. Same reparent() as the
// inspector's Parent picker: it stays where it is in the world, and one undo puts it back.
var treeDrag = { timer: 0, id: null, active: false, over: null, justDropped: false };
function treeDragStart(ev, li, id) {
  if (playing || ev.button > 0) return;
  clearTimeout(treeDrag.timer);
  const x0 = ev.clientX, y0 = ev.clientY;
  const cancel = () => { clearTimeout(treeDrag.timer); removeEventListener('pointermove', early); };
  const early = m => { if (Math.hypot(m.clientX - x0, m.clientY - y0) > 8) cancel(); };   // moved first = a scroll, not a drag
  addEventListener('pointermove', early); addEventListener('pointerup', cancel, { once: true });
  treeDrag.timer = setTimeout(() => {
    removeEventListener('pointermove', early);

// Where new things go: cast a ray through the middle of the screen and land on the ground or a Solid

const dropRay = new THREE.Raycaster();
function surfaceHit(ndc) {

}

  const hit = dropRay.intersectObjects(surfaces, true).find(h => h.object.visible && h.object.isMesh && !h.object.userData.outline);
  const plane = dropRay.ray.intersectPlane(new THREE.Plane(new THREE.Vector3(0, 1, 0), 0), new THREE.Vector3());

// Duplicate puts the copy beside the original as seen from the camera (screen-right), a body-width away.
function duplicateOffset(id) {
  const right = new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld, 0).setY(0);
  if (right.lengthSq() < 1e-6) right.set(1, 0, 0);

  const gap = size && isFinite(size.x) ? Math.min(Math.max(size.x, size.z) + 0.3, 20) : 1;

// ---- inspector generated from behavior schemas
function control(def, value, onChange) {
  if (def.type === 'rules') return rulesEditor(value || [], onChange);
  const row = document.createElement('div'); row.className = 'row';
  if (def.type === 'number') {
    row.innerHTML = `<input type="range" min="${def.min ?? 0}" max="${def.max ?? 10}" step="${def.step ?? 0.1}" value="${value}"><output>${value}</output>`;
    const [inp, out] = row.children;
    inp.oninput = () => { out.textContent = inp.value; onChange(+inp.value); };
  } else if (def.type === 'boolean') {
    row.innerHTML = `<input type="checkbox" ${value ? 'checked' : ''}>`;
    row.firstChild.onchange = e => onChange(e.target.checked);
  } else if (def.type === 'vec3') {
    value.forEach((v, i) => {
      const inp = document.createElement('input'); inp.type = 'number'; inp.step = '0.1'; inp.value = v;
      inp.onchange = () => { const nv = [...value]; nv[i] = +inp.value; value = nv; onChange(nv); };
      row.append(inp);
    });
  } else if (def.type === 'color') {
    row.innerHTML = `<input type="color" value="${value}">`;
    row.firstChild.oninput = e => onChange(e.target.value);
  } else {
    row.innerHTML = `<input type="text" value="${value}">`;
    row.firstChild.onchange = e => onChange(e.target.value);
  }
  return row;
}

// Reactions editor: "When ▾ [fields]  If [once] [cooldown] [chance]  Do ▾ [fields] …" per rule, dropdowns from the
// vocabulary in runtime/reactions.js (no code). Every change hands back a fresh copy of the whole list.
var showGraph = false;   // remembered across objects while the editor is open
function rulesEditor(rules, onChange) {
  const wrap = document.createElement('div'); wrap.className = 'rules';
  const commit = () => { onChange(structuredClone(rules)); draw(); };
  const fieldInputs = (obj, table) => {
    const box = document.createElement('span'); box.className = 'ruleFields';
    for (const [k, d] of Object.entries(table[obj.type] || {})) {
      const lab = document.createElement('label'); lab.textContent = k;
      if (Array.isArray(d)) {
        const v = obj[k] ?? d;
        v.forEach((n, i) => { const inp = document.createElement('input'); inp.type = 'number'; inp.step = '0.1'; inp.value = n;
          inp.onchange = () => { obj[k] = [...(obj[k] ?? d)]; obj[k][i] = +inp.value; commit(); }; lab.append(inp); });
      } else {
        const inp = document.createElement('input');
        inp.type = typeof d === 'number' ? 'number' : 'text'; if (inp.type === 'number') inp.step = 'any';
        inp.value = obj[k] ?? d;
        inp.onchange = () => { obj[k] = typeof d === 'number' ? +inp.value : inp.value; commit(); };
        lab.append(inp);
      }
      box.append(lab);
    }
    return box;
  };
  const typeSelect = (obj, table, onPick) => {
    const sel = document.createElement('select');
    sel.innerHTML = Object.keys(table).map(t => `<option ${t === obj.type ? 'selected' : ''}>${t}</option>`).join('');
    sel.onchange = () => onPick(sel.value);
    return sel;
  };
  function draw() {
    wrap.innerHTML = '';
    rules.forEach((r, i) => {
      const card = document.createElement('div'); card.className = 'rule';
      const head = document.createElement('div'); head.className = 'ruleRow';
      head.innerHTML = '<b>When</b>';
      head.append(typeSelect(r.when, RX.WHEN, t => { r.when = RX.withDefaults(RX.WHEN, t); commit(); }), fieldInputs(r.when, RX.WHEN));
      const x = document.createElement('button'); x.textContent = '✕'; x.title = 'Delete rule'; x.onclick = () => { rules.splice(i, 1); commit(); };
      head.append(x);
      const cond = document.createElement('div'); cond.className = 'ruleRow';
      r.if ||= {};
      cond.innerHTML = `<b>If</b><label><input type="checkbox" ${r.if.once ? 'checked' : ''}> once</label><label>cooldown <input type="number" step="0.5" min="0" value="${r.if.cooldown ?? 0}"></label><label>chance <input type="number" step="0.1" min="0" max="1" value="${r.if.chance ?? 1}"></label>`;
      const [once, cd, ch] = cond.querySelectorAll('input');
      once.onchange = () => { r.if.once = once.checked; commit(); };
      cd.onchange = () => { r.if.cooldown = Math.max(0, +cd.value); commit(); };
      ch.onchange = () => { r.if.chance = Math.min(1, Math.max(0, +ch.value)); commit(); };
      card.append(head, cond);
      (r.do ||= []).forEach((a, j) => {
        const row = document.createElement('div'); row.className = 'ruleRow';
        row.innerHTML = `<b>${j ? 'and' : 'Do'}</b>`;
        row.append(typeSelect(a, RX.DO, t => { r.do[j] = RX.withDefaults(RX.DO, t); commit(); }), fieldInputs(a, RX.DO));
        const rm = document.createElement('button'); rm.textContent = '–'; rm.title = 'Remove action';
        rm.onclick = () => { r.do.splice(j, 1); if (!r.do.length) r.do.push(RX.withDefaults(RX.DO, 'say')); commit(); };
        row.append(rm); card.append(row);
      });
      const addA = document.createElement('button'); addA.className = 'ruleAdd'; addA.textContent = '+ action';
      addA.onclick = () => { r.do.push(RX.withDefaults(RX.DO, 'say')); commit(); };
      card.append(addA);
      wrap.append(card);
    });
    const bar = document.createElement('div'); bar.className = 'ruleRow';
    const addR = document.createElement('button'); addR.className = 'ruleAdd'; addR.textContent = '+ rule';
    addR.onclick = () => { rules.push(RX.newRule()); commit(); };
    const gr = document.createElement('button'); gr.className = 'ruleAdd'; gr.textContent = showGraph ? '◇ Hide graph' : '◇ Graph';
    gr.onclick = () => { showGraph = !showGraph; draw(); };
    bar.append(addR, gr); wrap.append(bar);
    if (showGraph && rules.length) { const g = document.createElement('div'); g.className = 'graphBox'; g.innerHTML = RX.graphSvg(rules); wrap.append(g); }
  }
  draw();
  return wrap;
}

// ---- 🖌 Scatter brush: pick a prefab, drag on the ground/solids; instances land `gap` apart with a random turn
// and size variety (jitter slider). 🧽 Erase mode removes that prefab's instances under the drag. One undo step and
// one rebuild per stroke. One finger/left mouse paints; two fingers orbit + zoom (right mouse pans, wheel zooms).
let scatterOn = false, eraseMode = false, stroke = null, twoFinger = false;
const brushPointers = new Set();
const savedNav = { touch: orbit.touches.ONE, mouse: orbit.mouseButtons.LEFT };
function fillScatter() {
  const show = shown(), names = [...new Set([...Object.keys(data.prefabs || {}), ...prefabLibrary.filter(n => show({ kind: 'prefab', name: n }))])].sort();
  const cur = $('scPrefab').value || ['grass_tuft', 'tree', 'rock_round'].find(n => names.includes(n)) || names[0];
  $('scPrefab').innerHTML = names.map(n => `<option ${n === cur ? 'selected' : ''}>${n}</option>`).join('');
}
$('scatter').onclick = () => {
  if (playing) return;
  scatterOn = !scatterOn;
  if (stroke) cancelStroke();
  $('scatter').classList.toggle('on', scatterOn); $('scatterBar').hidden = !scatterOn;
  // keep the orbit controls on so two fingers still orbit/zoom; only the one-finger / left-button drag is the brush's
  orbit.touches.ONE = scatterOn ? -1 : savedNav.touch;
  orbit.mouseButtons.LEFT = scatterOn ? -1 : savedNav.mouse;
  if (scatterOn) { select(null); fillScatter(); }
};
$('scMode').onclick = () => {
  eraseMode = !eraseMode;
  $('scMode').textContent = eraseMode ? '🧽 Erase' : '🖌 Paint';
  $('scatterBar').classList.toggle('erase', eraseMode);
  $('scHint').textContent = eraseMode ? '1 finger erases · 2 fingers orbit' : '1 finger paints · 2 fingers orbit';
};
$('scSpacing').oninput = () => { $('scSpacingV').textContent = (+$('scSpacing').value).toFixed(2).replace(/\.?0+$/, '') + ' m'; };
const ndcOf = e => new THREE.Vector2((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
const brushDot = (p, color) => {
  const dot = new THREE.Mesh(new THREE.SphereGeometry(0.15, 8, 6), new THREE.MeshBasicMaterial({ color }));   // sc:overlay (stroke preview)
  dot.position.fromArray(p); dot.raycast = () => {}; world.scene.add(dot); stroke.dots.push(dot);
};
function strokeAt(e) {
  const hit = surfaceHit(ndcOf(e)); if (!hit) return;
  const p = hit.point.toArray(), gap = +$('scSpacing').value;
  if (stroke.erase) {
    for (const id of scatterEraseIds(data, $('scPrefab').value, [p], eraseRadius(gap))) {
      if (stroke.ids.has(id)) continue;
      stroke.ids.add(id);
      const pos = data.entities.find(x => x.id === id).position;   // painted instances are top-level
      brushDot([pos[0], pos[1] + 0.3, pos[2]], 0xff5d5d);
    }
    return;
  }
  for (const q of scatterPoints([p], gap, stroke.placed)) { stroke.points.push(q); brushDot(q, 0x3ddc84); }
}
function cancelStroke() {
  for (const d of stroke.dots) { world.scene.remove(d); d.geometry.dispose(); d.material.dispose(); }
  stroke = null;
}
renderer.domElement.addEventListener('pointerdown', e => {
  if (!scatterOn) return;
  brushPointers.add(e.pointerId);
  if (brushPointers.size > 1) { twoFinger = true; if (stroke) cancelStroke(); return; }   // second finger → orbit, drop the stroke
  if (stroke || twoFinger || (e.pointerType === 'mouse' && e.button !== 0)) return;
  stroke = { id: e.pointerId, erase: eraseMode, placed: [], points: [], ids: new Set(), dots: [] };
  try { renderer.domElement.setPointerCapture(e.pointerId); } catch {}
  strokeAt(e);
});
renderer.domElement.addEventListener('pointermove', e => { if (stroke && e.pointerId === stroke.id) strokeAt(e); });
const endStroke = async e => {
  brushPointers.delete(e.pointerId);
  if (!brushPointers.size) twoFinger = false;           // all fingers up: the next touch can paint again
  if (!stroke || e.pointerId !== stroke.id) return;
  const { points, ids, erase } = stroke; cancelStroke();
  if (e.type === 'pointercancel') return;
  const name = $('scPrefab').value;
  if (erase) {
    if (!ids.size) return;
    record();
    for (const id of ids) deleteEntity(data, id);
  } else {
    if (!points.length) return;
    record();
    if (!data.prefabs?.[name]) data.prefabs = { ...data.prefabs, [name]: `./prefabs/${name}.prefab.json` };
    const opts = jitterOptions(+$('scJitter').value);
    for (const p of points) scatterEntity(data, name, p.map(v => Math.round(v * 1000) / 1000), Math.random, opts);
  }
  await refresh(); fillAdd(); renderTree();
};
renderer.domElement.addEventListener('pointerup', endStroke);

// ---- tapping: select in edit mode, move the player in play mode
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();

  ptr.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ptr, camera);
  const hits = ray.intersectObjects(world.scene.children, true).filter(h => h.object.visible && !isGizmo(h.object));
  if (playing) {
    const g = hits.find(h => h.point.y < 0.3 && entityIdOf(h.object) !== 'player');   // any floor surface

  while (id && world.getEntity(id)?.inherited) id = world.getEntity(id).parent;   // a prefab's own child: edit the instance
  const ent = id && world.getEntity(id);

// ---- live link: when served by `npm run dev`, every edit is sent to running games (play.html) to hot-patch,
// the selection is shown in the game, and games report back FPS, errors and the selected object's live position.
var sendSelect, liveOn = () => false;
{
  let ws, lastSent = '', gameErrors = 0, stale;
  sendSelect = () => { if (ws?.readyState === 1) ws.send(JSON.stringify({ type: 'select', url: SCENE_URL, id: selectedId })); };
  liveOn = () => ws?.readyState === 1;
  const connect = () => {
    try { ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/live`); } catch { return; }
    ws.onopen = () => { renderPanel(); lastSent = ''; $('play').title = 'Live link on'; $('liveBadge').hidden = false; $('liveBadge').textContent = describeState(null); sendSelect(); };
    ws.onclose = () => { $('liveBadge').hidden = true; setTimeout(connect, 3000); };
    ws.onmessage = ev => {
      let s; try { s = JSON.parse(ev.data); } catch { return; }
      if (s.type === 'cmd' && (!s.scene || sameScene(s.scene, SCENE_URL))) {      // from the MCP server
        editorCommand(s.op, s.args || {}).then(
          r => ws.send(JSON.stringify({ type: 'cmd-result', id: s.id, ok: true, ...r })),
          e => ws.send(JSON.stringify({ type: 'cmd-result', id: s.id, ok: false, error: e.message })));
        return;
      }
      if (s.type === 'bridge-return' && (!s.scene || sameScene(s.scene, SCENE_URL))) {   // edited model back from Blender
        if (s.prefab) {                                                              // the prefab file changed: every instance
          if (!data.prefabs?.[s.prefab]) return;
          if (playing) { showErr(`Blender updated prefab ${s.prefab} — stop play to see it`); return; }
          rebuild().then(() => renderPanel());
          return;
        }
        const ent = world.getEntity(s.id);
        if (!ent || playing) { showErr(`Blender sent back ${s.id} but ${playing ? 'the scene is playing — stop and send again' : 'it is not in this scene'}`); return; }
        record();
        if (replaceModel(data, s.id, s.glb, assetOf(ent), world.characters)) rebuild().then(() => { select(s.id); fillAdd(); });
        return;
      }
      if (s.type === 'pick' && sameScene(s.url, SCENE_URL)) {                     // tapped in a running game
        if (!s.id || world.getEntity(s.id)) { select(s.id); if (s.id) frame(s.id); }
        return;
      }
      if (s.type !== 'state' || !sameScene(s.url, SCENE_URL)) return;
      for (const m of s.errors || []) { gameErrors++; showErr('[game] ' + m); }
      $('liveBadge').textContent = describeState(s, gameErrors);
      clearTimeout(stale); stale = setTimeout(() => { $('liveBadge').textContent = describeState(null); }, 2000);   // game closed
      const li = $('liveIn');
      if (li) li.textContent = s.selected && s.selected.id === selectedId
        ? `in game: ${s.selected.position.map(v => v.toFixed(2)).join(', ')}${s.selected.visible ? '' : ' · hidden'}` : '';
    };
  };
  if (location.protocol.startsWith('http') && new URLSearchParams(location.search).get('live') !== '0') connect();
  setInterval(() => {
    if (ws?.readyState !== 1) return;
    const text = JSON.stringify({ type: 'scene', url: SCENE_URL, data });
    if (text !== lastSent) { ws.send(text); lastSent = text; flashLive(); }
  }, 250);
}

// ---- commands from Claude (MCP server → dev server → here). Scene edits go through runtime/commands.js,
// are undoable like any other edit, and show up on screen (and in live games) immediately.
async function editorCommand(op, args) {
  if (COMMANDS[op]) {
    const ctx = { schemas: Object.fromEntries(behaviorNames().map(n => [n, getBehavior(n).schema])), prefabs: world.prefabs, library: {},
      packs: /pack/.test(op) || op === 'batch' ? await loadPacks() : libPacks || [], unlocks: packUnlocks(),
      motions: /motion/.test(op) || op === 'batch' ? await loadMotionIndex() : null };
    // spawning a prefab the scene doesn't list yet: fetch it from prefabs/ (commands.js adds it to the scene)
    const placing = t => t === 'spawn' || t === 'add_light';
    const spawns = placing(op) ? [args] : op === 'batch' ? (args.calls || []).filter(c => placing(c?.tool)).map(c => c.args || {}) : [];
    for (const name of new Set(spawns.map(a => a.prefab).filter(n => typeof n === 'string' && /^[a-z0-9_]+$/.test(n) && !data.prefabs?.[n])))
      try { const r = await fetch(`./prefabs/${name}.prefab.json`); if (r.ok) ctx.library[name] = await r.json(); } catch {}
    // spawn with no position: drop it where the editor is looking (screen centre on the ground / a solid)
    if (spawns.some(a => a.position === undefined)) { const p = viewDropPoint(); for (const a of spawns) if (a.position === undefined) a.position = p; }
    if (COMMANDS[op].mutates && playing) throw new Error('Stop play mode first (use the stop tool) — edits made while playing are thrown away.');
    const before = structuredClone(data);
    const { result, changed } = runCommand(data, op, args, ctx);
    if (changed) {
      hist.record(before); updateUndo();
      if (selectedId && !findEntity(data, selectedId)) selectedId = null;
      await refresh(before);   // moves, params, adds and deletes patch in place (fast); the rest rebuilds
      renderPanel();
    }
    return { result };
  }
  switch (op) {
    case 'ping': return { result: { scene: SCENE_URL, playing } };
    case 'get_selection': return { result: selectedId ? runCommand(data, 'get_entity', { id: selectedId }, { prefabs: world.prefabs }).result : null };
    case 'select':
      if (args.id && !world.getEntity(args.id)) throw new Error(`No entity "${args.id}"`);
      select(args.id || null); if (args.id) frame(args.id);
      return { result: { selected: selectedId } };
    case 'play': case 'stop':
      if ((op === 'play') !== playing) await $('play').onclick();
      if (op === 'play' && args.seconds) await new Promise(r => setTimeout(r, Math.min(10, args.seconds) * 1000));
      return { result: { playing } };
    case 'screenshot': {
      const max = Math.min(1024, args.maxSize || 768);
      if (post) post.render(); else renderer.render(world.scene, camera);       // draw now so the buffer is fresh
      const src = renderer.domElement, k = Math.min(1, max / Math.max(src.width, src.height));
      const c = document.createElement('canvas'); c.width = Math.round(src.width * k); c.height = Math.round(src.height * k);
      c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
      return { result: { width: c.width, height: c.height, playing, selected: selectedId }, image: c.toDataURL('image/jpeg', 0.8).split(',')[1], mime: 'image/jpeg' };
    }
    case 'read_errors': {
      const box = $('err'), errors = box.textContent ? box.textContent.split('\n') : [];
      if (args.clear) { box.textContent = ''; box.hidden = true; }
      return { result: { errors } };
    }
    case 'get_scene': return { result: { url: SCENE_URL, data } };
    default: throw new Error(`Unknown command "${op}"`);
  }
}

    li.innerHTML = '<span></span><small></small>';
    li.firstChild.textContent = it.name; li.lastChild.textContent = it.sub;
    if (it.thumb) { const img = new Image(); img.src = it.thumb; img.alt = ''; img.loading = 'lazy'; li.prepend(img); li.classList.add('thumb'); }
    if (it.header) li.className = 'head'; else li.onclick = it.pick;
    if (it.locked) li.classList.add('locked');
    if (it.btn) { const b = document.createElement('button'); b.className = 'packbtn'; b.textContent = it.btn;
      b.onclick = ev => { ev.stopPropagation(); it.act(); }; li.append(b); }
    ul.append(li);
  }
}
function closeLib() { $('lib').classList.remove('open'); $('libBtn').classList.remove('on'); }
$('libBtn').onclick = () => {
  const open = !$('lib').classList.contains('open');
  if (open) { $('tree').classList.remove('open'); $('list').classList.remove('on'); }
  $('lib').classList.toggle('open', open); $('libBtn').classList.toggle('on', open); renderLib();
};
$('lib').querySelector('.tabs').onclick = ev => {
  const t = ev.target.dataset.t; if (!t) return;
  libTab = t; for (const b of $('lib').querySelectorAll('.tabs button')) b.classList.toggle('on', b.dataset.t === t);
  renderLib();
};
$('libSearch').oninput = renderLib;
$('save').onclick = async () => {
  const json = JSON.stringify(data, null, 2);
  try { await navigator.clipboard.writeText(json); $('save').textContent = 'Copied ✓'; }
  catch { const blob = new Blob([json], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = SCENE_URL.split('/').pop(); a.click(); $('save').textContent = 'Saved ✓'; }
  setTimeout(() => ($('save').textContent = 'Copy'), 1500);
};

// ---- loop
function resize() { renderer.setSize(innerWidth, innerHeight); post?.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
// block double-tap / pinch page zoom on iOS
document.addEventListener('gesturestart', e => e.preventDefault());
let lastTouch = 0;
document.addEventListener('touchend', e => { const n = Date.now(); if (n - lastTouch < 300) e.preventDefault(); lastTouch = n; }, { passive: false });

await rebuild();
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  world.animate(dt, playing);
  world.followFocus(orbit.target);
  if (playing) world.update(dt);
  const selObj = !playing && world.getEntity(selectedId)?.object3d;   // highlight what's selected
  if (selBox) { selBox.visible = !!selObj && (!selObj.isLight || !!selObj.userData.marker); if (selBox.visible) selBox.setFromObject(selObj); }
  orbit.update();
  if (post) post.render(); else renderer.render(world.scene, camera);
});
</script>
