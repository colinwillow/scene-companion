<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Tiny Hop — Scene Companion</title>
<style>
  html, body { margin:0; height:100%; background:#12161d; color:#fff; overflow:hidden;
    font: 600 16px/1.3 system-ui, -apple-system, sans-serif;
    touch-action:none; -webkit-user-select:none; user-select:none; overscroll-behavior:none; -webkit-touch-callout:none; }
  canvas { display:block; position:fixed; inset:0; width:100%; height:100%; touch-action:none; }
  #hud { position:fixed; top:calc(10px + env(safe-area-inset-top)); left:calc(12px + env(safe-area-inset-left)); right:calc(12px + env(safe-area-inset-right));
    display:flex; justify-content:space-between; pointer-events:none; text-shadow:0 2px 4px #0008; font-size:20px; z-index:2; }
  #hud button { pointer-events:auto; font-size:14px; background:#0006; color:#fff; border:none; padding:6px 10px; border-radius:10px; }
  #hud button.on { background:#3ddc84; color:#0b3d1f; }
  #hud a { pointer-events:auto; color:#fff; font-size:14px; background:#0006; padding:6px 10px; border-radius:10px; text-decoration:none; }
  #stick { position:fixed; width:120px; height:120px; margin:-60px 0 0 -60px; border-radius:50%; background:#ffffff22; border:2px solid #ffffff55; display:none; z-index:2; pointer-events:none; }
  #knob { position:absolute; left:35px; top:35px; width:50px; height:50px; border-radius:50%; background:#ffffffaa; }
  #jump { position:fixed; right:calc(22px + env(safe-area-inset-right)); bottom:calc(26px + env(safe-area-inset-bottom)); width:92px; height:92px; border-radius:50%;
    background:#ff8a3dcc; border:3px solid #fff8; color:#111; font:800 18px system-ui; z-index:2; touch-action:none; }
  #jump:active { transform:scale(0.94); }
  #hint { position:fixed; left:0; right:0; bottom:calc(130px + env(safe-area-inset-bottom)); text-align:center; color:#fffc; font-size:14px; text-shadow:0 1px 3px #000; z-index:2; pointer-events:none; transition:opacity 1s; }
  #msg { position:fixed; inset:0; display:none; align-items:center; justify-content:center; flex-direction:column; gap:14px; background:#0008; z-index:3; font-size:30px; }
  #msg button { font:700 18px system-ui; padding:12px 22px; border-radius:14px; border:none; background:#ff8a3d; color:#111; }
  #err { position:fixed; left:8px; right:8px; top:calc(50px + env(safe-area-inset-top)); z-index:4; background:#5a1d1d; color:#ffd9d9; border-radius:10px; padding:10px; font:12px/1.4 ui-monospace,monospace; white-space:pre-wrap; }
  #liveBadge { position:fixed; left:calc(8px + env(safe-area-inset-left)); bottom:calc(8px + env(safe-area-inset-bottom)); z-index:5; pointer-events:none;
    font:700 11px/1 system-ui, sans-serif; letter-spacing:.06em; color:#d6ffe0; background:#0b3d1fcc; border:1px solid #3ddc84aa; padding:4px 7px; border-radius:999px; transition:background .2s; }
  #liveBadge.flash { background:#3ddc84; color:#0b3d1f; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="hud"><span id="hearts"></span><span><button id="pick" hidden title="Tap objects to select them in the editor">🎯</button> <button id="mute">🔊</button> <a href="./index.html?scene=./scenes/tiny-hop.scene.json">Edit</a></span><span id="coins"></span></div>
<div id="stick"><div id="knob"></div></div>
<button id="jump">JUMP</button>
<div id="hint">Left side: drag to move · Right side: drag to look · Jump on enemies</div>
<div id="msg"><div id="msgText"></div><button id="again">Play again</button></div>
<div id="err" hidden></div>
<div id="liveBadge" hidden>● LIVE</div>
<script>
window.__errQueue=[];
function showErr(m){const e=document.getElementById('err');e.hidden=false;e.textContent+=(e.textContent?'\n':'')+m;window.__errQueue.push(m);}
addEventListener('error',e=>showErr(e.message));
addEventListener('unhandledrejection',e=>showErr(String(e.reason?.message||e.reason)));
</script>
<script type="module">
// Game page: renders a scene and turns touch/keys into world.input. All game logic lives in behaviors.
import * as THREE from 'three';
import { World } from './runtime/World.js';
import { createPost } from './runtime/post.js';
import { applyScene } from './runtime/livepatch.js';
import { clipCamera } from './runtime/camera.js';
import { createSfx } from './runtime/sfx.js';
import { createFpsMeter, buildState, sameScene } from './runtime/livestate.js';
import './behaviors/index.js';

const $ = id => document.getElementById(id);
const SCENE_URL = new URLSearchParams(location.search).get('scene') || './scenes/tiny-hop.scene.json';
const TIER = new URLSearchParams(location.search).get('tier') || 'web';
let data = await (await fetch(SCENE_URL)).json();

const renderer = new THREE.WebGLRenderer({ antialias: true });
document.body.prepend(renderer.domElement);
const camera = new THREE.PerspectiveCamera(60, 1, 0.1, 3000);
let world, post, player, coinsTotal, over;

// ---- sounds (synthesized; browsers only allow audio after the first tap)
let muted = false; try { muted = localStorage.getItem('sc.muted') === '1'; } catch {}
const sfx = createSfx({ muted });
const muteBtn = $('mute');
const showMute = () => (muteBtn.textContent = sfx.muted ? '🔇' : '🔊');
showMute();
muteBtn.addEventListener('pointerdown', e => { e.stopPropagation(); sfx.unlock(); sfx.muted = !sfx.muted; showMute(); try { localStorage.setItem('sc.muted', sfx.muted ? '1' : '0'); } catch {} });
addEventListener('pointerdown', () => sfx.unlock(), { capture: true });
addEventListener('keydown', () => sfx.unlock(), { capture: true });

// ---- input → world.input (camera-relative, world space)
let yaw = 0, pitch = 0.35;                  // camera orbit around the player
const keys = new Set();
const stick = { id: null, x0: 0, y0: 0, dx: 0, dy: 0 };
const look = { id: null, x: 0, y: 0 };
const input = { move: [0, 0], jump: false };

addEventListener('keydown', e => { keys.add(e.code); if (e.code === 'Space') { input.jump = true; e.preventDefault(); } });
addEventListener('keyup', e => keys.delete(e.code));
$('jump').addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); input.jump = true; });

const cv = renderer.domElement;
cv.addEventListener('pointerdown', e => {
  if (pickMode) { pickAt(e.clientX, e.clientY); return; }
  if (e.clientX < innerWidth * 0.5 && stick.id === null) {
    Object.assign(stick, { id: e.pointerId, x0: e.clientX, y0: e.clientY, dx: 0, dy: 0 });
    $('stick').style.display = 'block'; $('stick').style.left = e.clientX + 'px'; $('stick').style.top = e.clientY + 'px';
  } else if (look.id === null) Object.assign(look, { id: e.pointerId, x: e.clientX, y: e.clientY });
  $('hint').style.opacity = 0;
});
cv.addEventListener('pointermove', e => {
  if (e.pointerId === stick.id) {
    let dx = e.clientX - stick.x0, dy = e.clientY - stick.y0; const d = Math.hypot(dx, dy), max = 50;
    if (d > max) { dx *= max / d; dy *= max / d; }
    stick.dx = dx / max; stick.dy = dy / max;
    $('knob').style.transform = `translate(${dx}px, ${dy}px)`;
  } else if (e.pointerId === look.id) {
    yaw -= (e.clientX - look.x) * 0.008;
    pitch = Math.min(1.2, Math.max(0.05, pitch + (e.clientY - look.y) * 0.005));
    look.x = e.clientX; look.y = e.clientY;
  }
});
const release = e => {
  if (e.pointerId === stick.id) { stick.id = null; stick.dx = stick.dy = 0; $('stick').style.display = 'none'; $('knob').style.transform = ''; }
  if (e.pointerId === look.id) look.id = null;
};
cv.addEventListener('pointerup', release); cv.addEventListener('pointercancel', release);

function readInput() {
  let ix = stick.dx, iy = stick.dy;          // screen: x right, y down
  if (keys.has('KeyA') || keys.has('ArrowLeft')) ix -= 1;
  if (keys.has('KeyD') || keys.has('ArrowRight')) ix += 1;
  if (keys.has('KeyW') || keys.has('ArrowUp')) iy -= 1;
  if (keys.has('KeyS') || keys.has('ArrowDown')) iy += 1;
  const len = Math.hypot(ix, iy); if (len > 1) { ix /= len; iy /= len; }
  // Camera looks along -forward; forward on the ground = (-sin yaw, -cos yaw).
  const fx = -Math.sin(yaw), fz = -Math.cos(yaw), rx = Math.cos(yaw), rz = -Math.sin(yaw);
  world.input.move = [rx * ix - fx * iy, rz * ix - fz * iy];
  if (input.jump) { world.input.jump = true; input.jump = false; }
}

// ---- HUD
const hearts = (n, max) => '❤'.repeat(n) + '♡'.repeat(Math.max(0, max - n));
function hud() {
  const h = player.behaviors.find(b => b.constructor.name === 'Health');
  $('hearts').textContent = h ? hearts(h.current, h.params.max) : '';
  const got = coinsTotal - [...world.entities.values()].filter(e => e.behaviors.some(b => b.constructor.name === 'Pickup' && !b.collected)).length;
  $('coins').textContent = `● ${got} / ${coinsTotal}`;
  if (!over && got === coinsTotal) { sfx.play('win'); end('You got every coin! 🎉'); }
}
function end(text) { over = true; $('msgText').textContent = text; $('msg').style.display = 'flex'; }

async function start() {
  world?.dispose(); post?.dispose();
  over = false; $('msg').style.display = 'none';
  world = new World(renderer, { tier: TIER });
  await world.load(structuredClone(data));    // the authored data is never touched by play
  window.__sc = { world, data, get live() { return liveStatus; } };
  player = world.getEntity('player');
  coinsTotal = [...world.entities.values()].filter(e => e.behaviors.some(b => b.constructor.name === 'Pickup')).length;
  world.on('gameover', () => { sfx.play('gameover'); end('Game over'); });
  world.on('health', () => { sfx.play('hurt'); hud(); });
  for (const [ev, snd] of [['jump', 'jump'], ['land', 'land'], ['step', 'step'], ['pickup', 'coin'], ['stomp', 'stomp'], ['respawn', 'respawn']]) world.on(ev, () => sfx.play(snd));
  post = createPost(renderer, world.scene, camera, data.settings.post, TIER);
  world.scene.add(marker);                     // editor-selection marker (debug overlay, not part of the scene file)
  resize(); hud();
}
$('again').onclick = start;

// ---- camera: behind and above the player, smoothed; pulls in when a solid is in the way
const focus = new THREE.Vector3(), camPos = new THREE.Vector3();
const CAM_DIST = 7;
let camDist = CAM_DIST;
function updateCamera(dt, snap) {
  const p = player.object3d.position;
  focus.set(p.x, p.y + 1.3, p.z);
  const dir = [Math.sin(yaw) * Math.cos(pitch), Math.sin(pitch), Math.cos(yaw) * Math.cos(pitch)];
  const boxes = (world.solids || []).map(s => s.box());
  const allowed = clipCamera([focus.x, focus.y, focus.z], dir, CAM_DIST, boxes, { floorY: player.behaviors.find(b => b.constructor.name === 'PlayerController')?.params.groundY ?? 0 });
  // Snap in fast when blocked (never look through a wall), ease back out slowly.
  camDist = snap || allowed < camDist ? allowed : camDist + (allowed - camDist) * (1 - Math.exp(-dt * 3));
  camPos.set(focus.x + dir[0] * camDist, focus.y + dir[1] * camDist, focus.z + dir[2] * camDist);
  const blocked = allowed < CAM_DIST - 0.01;
  camera.position.lerp(camPos, snap || blocked ? 1 : 1 - Math.exp(-dt * 8));
  camera.lookAt(focus);
}

function resize() { renderer.setSize(innerWidth, innerHeight); post?.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', resize);
// lock page zoom (double-tap / pinch), iOS included
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault());
let lastTouch = 0;
document.addEventListener('touchend', e => { const n = Date.now(); if (n - lastTouch < 300) e.preventDefault(); lastTouch = n; }, { passive: false });
document.addEventListener('touchmove', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });

// ---- selection marker: shows what's selected in the editor (live link), bobbing above it
const marker = new THREE.Mesh(new THREE.ConeGeometry(0.22, 0.45, 12), new THREE.MeshBasicMaterial({ color: 0x3ddc84, depthTest: false, transparent: true, opacity: 0.9 }));   // sc:overlay
marker.rotation.x = Math.PI; marker.renderOrder = 999; marker.visible = false;
const markerBox = new THREE.Box3();
let selectedId = null;
function updateMarker(t) {
  const ent = selectedId && world.getEntity(selectedId);
  marker.visible = !!ent;
  if (!ent) return;
  markerBox.setFromObject(ent.object3d);
  const top = markerBox.isEmpty() ? ent.object3d.position.y : markerBox.max.y;
  marker.position.set(ent.object3d.position.x, top + 0.5 + Math.sin(t * 4) * 0.08, ent.object3d.position.z);
}

// ---- pick mode (live link): tap objects in the running game to select them in the editor
let pickMode = false;
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
const entityIdOf = o => { while (o) { if (o.userData.entityId) return o.userData.entityId; o = o.parent; } return null; };
$('pick').addEventListener('pointerdown', e => {
  e.stopPropagation(); pickMode = !pickMode;
  $('pick').classList.toggle('on', pickMode);
  $('jump').style.visibility = pickMode ? 'hidden' : '';
  stick.id = look.id = null; stick.dx = stick.dy = 0; $('stick').style.display = 'none';
});
function pickAt(x, y) {
  ptr.set((x / innerWidth) * 2 - 1, -(y / innerHeight) * 2 + 1);
  ray.setFromCamera(ptr, camera);
  const hit = ray.intersectObjects(world.scene.children, true).find(h => h.object !== marker && h.object.visible && entityIdOf(h.object));
  selectedId = hit ? entityIdOf(hit.object) : null;
  if (liveWs?.readyState === 1) liveWs.send(JSON.stringify({ type: 'pick', url: SCENE_URL, id: selectedId }));
}

// ---- live link: edits from the editor (served by `npm run dev`) patch this running game.
let liveStatus = '', liveWs = null;
{
  const connect = () => {
    let ws; try { ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/live`); } catch { return; }
    let queue = Promise.resolve();                       // handle edits one at a time (a rebuild takes a moment)
    ws.onmessage = ev => { queue = queue.then(() => handle(ev)).catch(e => showErr(e.message)); };
    const handle = async ev => {
      let msg; try { msg = JSON.parse(ev.data); } catch { return; }
      if (msg.type === 'select' && sameScene(msg.url, SCENE_URL)) { selectedId = msg.id || null; return; }
      if (msg.type !== 'scene' || !msg.data || !SCENE_URL.endsWith(msg.url.replace(/^\.\//, ''))) return;
      const result = world ? applyScene(world, data, msg.data) : 'rebuild';
      data = msg.data;
      if (result === 'rebuild') await start();
      liveStatus = result;
      if (result !== 'none') { const b = $('liveBadge'); b.classList.add('flash'); setTimeout(() => b.classList.remove('flash'), 300); }
    };
    ws.onopen = () => { $('liveBadge').hidden = false; $('pick').hidden = false; liveWs = ws; };
    ws.onclose = () => { $('liveBadge').hidden = true; $('pick').hidden = true; setTimeout(connect, 3000); };
  };
  if (location.protocol.startsWith('http')) connect();
}

await start();
updateCamera(0, true);
const clock = new THREE.Clock(), fps = createFpsMeter(1);
let reportIn = 0;
renderer.setAnimationLoop(() => {
  const raw = clock.getDelta(), dt = Math.min(raw, 0.05);
  fps.tick(raw);
  // report state to the editor twice a second (FPS, new errors, where the selected object really is)
  if ((reportIn -= raw) <= 0 && liveWs?.readyState === 1) {
    reportIn = 0.5;
    liveWs.send(JSON.stringify(buildState(world, { url: SCENE_URL, fps: fps.fps, errors: window.__errQueue.splice(0), selectedId })));
  }
  updateMarker(clock.elapsedTime);
  if (!over) { readInput(); world.update(dt); hud(); }
  world.animate(dt);
  updateCamera(dt);
  world.followFocus(focus);
  if (post) post.render(); else renderer.render(world.scene, camera);
});
</script>
</body>
</html>
