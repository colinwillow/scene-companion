<style>
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); overflow:hidden;
    font: 600 16px/1.3 var(--font);
    touch-action:none; -webkit-user-select:none; user-select:none; overscroll-behavior:none; -webkit-touch-callout:none; }
  canvas { display:block; position:fixed; inset:0; width:100%; height:100%; touch-action:none; }
  #hudMsg { position:fixed; left:50%; top:22%; transform:translateX(-50%); z-index:5; pointer-events:none; color:#fff; font:800 22px/1.2 var(--font); text-shadow:0 2px 8px #000a; text-align:center; max-width:86vw; transition:opacity .3s; }
  .bubble { position:fixed; left:0; top:0; z-index:4; pointer-events:none; background:#fff; color:#111; font:600 14px/1.25 var(--font); padding:6px 10px; border-radius:12px; max-width:60vw; box-shadow:0 2px 8px #0005; transition:opacity .25s; }
  #hud { position:fixed; top:calc(10px + env(safe-area-inset-top)); left:calc(12px + env(safe-area-inset-left)); right:calc(12px + env(safe-area-inset-right));
    display:flex; justify-content:space-between; pointer-events:none; text-shadow:0 2px 4px #0008; font-size:20px; z-index:2; }
  #hud button, #hud a { pointer-events:auto; font-size:14px; background:#0007; color:#fff; border:1px solid #fff2; padding:5px 6px; border-radius:var(--r-md); min-height:var(--tap); min-width:var(--tap); box-shadow:none; text-decoration:none; text-shadow:none; }
  #hud button.ib .iw, #hud a.ib .iw { font-size:10px; opacity:.9; }
  #hud button.on { background:var(--accent); color:var(--on-accent); }
  #hud > span { white-space:nowrap; } #hud > span:nth-child(2) { display:flex; gap:4px; align-items:center; }
  @media (max-width: 480px) { #hud { font-size:17px; } #hud > span:nth-child(2) { gap:3px !important; } #hud button, #hud a { min-width:37px; min-height:42px; padding:4px 2px; } #hud .ic { width:20px; height:20px; } }
  /* Floating twin sticks (Colin's games: rollergirl/weirdport). Each pad is an invisible zone; the stick rests at a
     corner as a hint and jumps to wherever the thumb lands. Coloured rim with ticks + solid knob with an ink edge,
     a different hue per pad (move vs camera/jump); a ring pop says a tap (jump) registered. */
  .pad { position:fixed; bottom:0; width:50%; height:68%; touch-action:none; z-index:1; --pc:#5fe1ff; --ink:#1b1033; }
  #stkL { left:0; } #stkR { right:0; --pc:#ff8a3d; }
  .ring, .knob { position:absolute; border-radius:50%; pointer-events:none; transform:translate(-50%,-50%); transition:opacity .13s; }
  .ring { width:132px; height:132px; border:3px solid var(--pc); background:#1b103322; box-shadow:0 0 0 2px #1b103370, inset 0 0 0 2px #1b103340; opacity:.5; }
  .ring::before { content:''; position:absolute; inset:7px; border-radius:50%; background:repeating-conic-gradient(from -3deg, var(--pc) 0 6deg, #0000 6deg 45deg);
    -webkit-mask:radial-gradient(closest-side,#0000 0 76%,#000 76%); mask:radial-gradient(closest-side,#0000 0 76%,#000 76%); opacity:.85; }
  .knob { width:58px; height:58px; background:var(--pc); border:3px solid var(--ink); box-shadow:0 3px 0 #1b103399, inset 0 -4px 0 #1b103333, inset 0 3px 0 #ffffff55; opacity:.55; }
  .knob::after { content:''; position:absolute; inset:13px; border-radius:50%; border:3px solid #1b1033aa; background:radial-gradient(circle,#fff8 0 22%,#0000 23%); }
  .pad.act .ring { opacity:1; background:#1b103333; } .pad.act .knob { opacity:1; transition:none; }
  .pad.pop .ring { animation:popr .3s ease-out; }
  @keyframes popr { 0% { transform:translate(-50%,-50%) scale(1); opacity:1 } 100% { transform:translate(-50%,-50%) scale(1.45); opacity:0 } }
  body.picking .pad { display:none; }
  #hint { position:fixed; left:0; right:0; bottom:calc(130px + env(safe-area-inset-bottom)); text-align:center; color:#fffc; font-size:14px; text-shadow:0 1px 3px #000; z-index:2; pointer-events:none; transition:opacity 1s; }
  #msg { position:fixed; inset:0; display:none; align-items:center; justify-content:center; flex-direction:column; gap:14px; background:#0008; z-index:3; font-size:30px; }
  #msg button { font:800 18px var(--font); padding:12px 22px; border-radius:var(--r-lg); border:none; background:var(--edit); color:var(--on-edit); }
  #pauseMenu { position:fixed; inset:0; display:none; align-items:center; justify-content:center; flex-direction:column; gap:14px; background:#000a; z-index:3; font-size:30px; }
  #pauseMenu button { font:800 18px var(--font); padding:12px 22px; min-width:160px; border-radius:var(--r-lg); border:none; background:var(--edit); color:var(--on-edit); }
  #pauseMenu button.ghost { background:transparent; color:inherit; border:2px solid #fff6; box-shadow:none; }
  #err { position:fixed; left:8px; right:8px; top:calc(50px + env(safe-area-inset-top)); z-index:4; background:var(--err-bg); color:var(--err-text); border-radius:var(--r-md); padding:10px; font:12px/1.4 var(--mono); white-space:pre-wrap; }
  #liveBadge { position:fixed; left:calc(8px + env(safe-area-inset-left)); bottom:calc(8px + env(safe-area-inset-bottom)); z-index:5; pointer-events:none;
    font:700 11px/1 var(--font); letter-spacing:.06em; color:#d6ffe0; background:#0b3d1fcc; border:1px solid #3ddc84aa; padding:4px 7px; border-radius:999px; transition:background .2s; }
  #stats { position:fixed; right:calc(8px + env(safe-area-inset-right)); top:calc(52px + env(safe-area-inset-top)); z-index:5; pointer-events:none; font:600 12px/1.35 var(--font); color:#fff; background:#0009; padding:4px 8px; border-radius:8px; white-space:pre; }
  #mixer { position:fixed; right:calc(12px + env(safe-area-inset-right)); top:calc(52px + env(safe-area-inset-top)); z-index:6; background:#000a; color:#fff; padding:10px 12px; border-radius:12px; display:flex; flex-direction:column; gap:8px; font:600 13px var(--font); touch-action:manipulation; }
  #mixer[hidden] { display:none; }
  #mixer label { display:flex; align-items:center; gap:8px; justify-content:space-between; }
  #mixer input { width:130px; }

  #scenes { position:fixed; inset:0; z-index:9; background:var(--scrim); display:flex; align-items:center; justify-content:center; touch-action:manipulation; }
  #scenes[hidden] { display:none; }
  #scenes .sbox { background:var(--panel-solid); border:1px solid var(--line); box-shadow:var(--sh-2); border-radius:var(--r-lg); width:min(420px, 92vw); max-height:84vh; overflow:auto; padding:12px; }
  #scenes .shead { display:flex; justify-content:space-between; align-items:center; font:800 18px var(--font); margin:4px 6px 10px; }
  #scenes .shead button { background:var(--raised); color:var(--text); border:none; border-radius:var(--r-sm); min-height:0; padding:6px 10px; font-size:16px; }
  #sceneList a { display:block; padding:14px 12px; margin:6px 0; border-radius:var(--r-md); background:var(--raised); color:var(--text); box-shadow:var(--sh-1); text-decoration:none; font:700 16px var(--font); }
  #sceneList a.here { background:var(--accent); color:var(--on-accent); }

  #title { position:fixed; inset:0; z-index:8; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; background:radial-gradient(#0007, #000c); text-align:center; padding:24px; }
  #title[hidden] { display:none; }
  #titleText { font:900 38px/1.1 var(--font); text-shadow:0 4px 18px #000; }
  #titleSub { font:600 17px/1.35 var(--font); opacity:.85; max-width:30em; }
  #titleGo { margin-top:10px; font:800 22px var(--font); padding:14px 34px; border:none; border-radius:var(--r-lg); background:var(--accent); color:var(--on-accent); box-shadow:var(--sh-1); }
  #liveBadge.flash { background:#3ddc84; color:#0b3d1f; }

// The import map, picked at load: ?renderer=webgpu (experimental, ultra) uses three's WebGPU build where the browser has

{ const gpu = new URLSearchParams(location.search).get('renderer') === 'webgpu' && 'gpu' in navigator;
  window.SC_WEBGPU = gpu;
  const webgl = 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js', webgpu = 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.webgpu.js';
  const im = document.createElement('script'); im.type = 'importmap';
  im.textContent = JSON.stringify({ imports: { three: gpu ? './runtime/three-webgpu-shim.js' : webgl, 'three/webgpu': webgpu, 'three/tsl': webgpu, 'three/addons/': 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/' } });
  document.currentScript.after(im); }

<script type="module">
// Game page: renders a scene and turns touch/keys into world.input. All game logic lives in behaviors.
import * as THREE from 'three';
import { World } from './runtime/World.js';
import { setIcon, iconize } from './ui/icons.js';
iconize(document);   // HUD buttons: icon + one word (Stage 9 icon set)
import { createPost } from './runtime/post.js';
import { applyScene } from './runtime/livepatch.js';
import { clipCamera } from './runtime/camera.js';
import { bindStick } from './runtime/sticks.js';
import { createSfx } from './runtime/sfx.js';
import { createAudio } from './runtime/audio.js';
import { createParticles } from './runtime/particles.js';
import { createTrails } from './runtime/trails.js';
import { createFpsMeter, buildState, sameScene, overBudget, BUDGETS } from './runtime/livestate.js';
import { pickRig } from './behaviors/index.js';
import { solidOutline } from './runtime/collide.js';

const $ = id => document.getElementById(id);
const SCENE_URL = new URLSearchParams(location.search).get('scene') || './scenes/tiny-hop.scene.json';
const TIER = new URLSearchParams(location.search).get('tier') || (() => { try { return localStorage.getItem('sc.tier'); } catch { return null; } })() || (window.__TAURI__ ? 'ultra' : 'web');   // ?tier=ultra, the editor's choice, else ultra in the desktop app
$('edit').href = `./index.html?scene=${encodeURIComponent(SCENE_URL)}`;
// 🎬 every example scene (scenes/index.json); opening play.html with no ?scene shows the list first
fetch('./scenes/index.json').then(r => r.json()).then(list => {
  const here = SCENE_URL.replace(/^\.\//, '');
  for (const sc of list) {
    const a = document.createElement('a'); a.href = `./play.html?scene=${encodeURIComponent(sc.file)}`;
    a.className = sc.file.replace(/^\.\//, '') === here ? 'here' : '';
    a.innerHTML = `${sc.title}${sc.note ? `<small>${sc.note}</small>` : ''}`;
    $('sceneList').append(a);
  }
  if (!new URLSearchParams(location.search).has('scene')) $('scenes').hidden = false;
}).catch(() => {});
$('scenesBtn').addEventListener('pointerdown', e => { e.stopPropagation(); $('scenes').hidden = false; });
$('scenesX').onclick = () => { $('scenes').hidden = true; };
let data = SCENE_URL.startsWith('desktop:') && window.__TAURI__ ? JSON.parse(await window.__TAURI__.core.invoke('load_scene', { name: SCENE_URL.slice(8) }))   // the desktop app's saved scenes
  : await (await fetch(SCENE_URL)).json();

// ?renderer=webgpu: three's WebGPURenderer (node materials; the toon look's shader patches and the particle shader do
// not carry over yet) with its own post (runtime/post-webgpu.js); anything else is the WebGL renderer as always.
const renderer = window.SC_WEBGPU ? new THREE.WebGPURenderer({ antialias: true }) : new THREE.WebGLRenderer({ antialias: true });
if (window.SC_WEBGPU) { await renderer.init(); console.info('Scene Companion: WebGPU renderer'); }
const postGPU = window.SC_WEBGPU ? (await import('./runtime/post-webgpu.js')).createPostGPU : null;
document.body.prepend(renderer.domElement);
const camera = new THREE.PerspectiveCamera(60, 1, 0.1, 3000);
let world, post, player, coinsTotal, over;

// ---- sounds (synthesized; browsers only allow audio after the first tap)
let muted = false; try { muted = localStorage.getItem('sc.muted') === '1'; } catch {}
const sfx = createSfx({ muted });
const audio = createAudio(); audio.muted = muted;   // sound FILES (AudioSource, scene music) on master / music / sfx buses
const muteBtn = $('mute');
const showMute = () => setIcon(muteBtn, sfx.muted ? 'mute' : 'sound', sfx.muted ? 'Muted' : 'Sound');
showMute();
// 🔊 opens the mixer: mute, and a slider per bus (kept per device)
const mixer = $('mixer');
for (const b of ['master', 'music', 'sfx']) { const r = mixer.querySelector(`[data-bus=${b}]`); r.value = audio.vol[b]; r.oninput = () => audio.setVolume(b, +r.value); }
const setMute = m => { sfx.muted = audio.muted = m; audio.setVolume(); showMute(); $('mixMute').textContent = m ? 'Sound off' : 'Sound on'; try { localStorage.setItem('sc.muted', m ? '1' : '0'); } catch {} };
$('mixMute').onclick = () => setMute(!sfx.muted); setMute(sfx.muted);
muteBtn.addEventListener('pointerdown', e => { e.stopPropagation(); sfx.unlock(); audio.unlock(); mixer.hidden = !mixer.hidden; });
addEventListener('pointerdown', () => { sfx.unlock(); audio.unlock(); }, { capture: true });
addEventListener('keydown', () => { sfx.unlock(); audio.unlock(); }, { capture: true });

// ---- input → world.input (camera-relative, world space)
let yaw = 0; const pitch = 0.35;            // camera orbit around the player (yaw only: right stick, Q/E)
const keys = new Set();
const input = { move: [0, 0], jump: false, attack: null };
const stickL = { x: 0, y: 0, down: false }, stickR = { x: 0, y: 0, down: false };
const YAW_RATE = 2.9;                        // rad/s at full right-stick deflection (rollergirl's CAM.yawRate)

addEventListener('keydown', e => { keys.add(e.code); if (e.code === 'Space') { input.jump = true; e.preventDefault(); } if (e.code === 'KeyF') input.attack = [0, 0]; if (e.code === 'KeyC') input.charge = true; if (e.code === 'KeyR') input.trick = [0, -1]; if (e.code === 'KeyV') input.trick = [0, 1]; if (e.code === 'KeyX') world.input.revert = true; });
addEventListener('keyup', e => { keys.delete(e.code); if (e.code === 'KeyC') input.charge = false; });

// Twin sticks: left = move, right = orbit (yaw only); a TAP jumps — right stick, or either (settings.controls.jumpTap).
// A right-stick FLICK strikes in the flicked direction (Melee behavior); hold and the left flick stay free.
const jumpTap = () => { input.jump = true; $('hint').style.opacity = 0; };
const tapEither = () => (data.settings?.controls?.jumpTap === 'either');
bindStick($('stkL'), stickL, { onTap: () => { if (tapEither()) jumpTap(); }, onHold: on => { input.charge = on; }, onFlick: (fx, fy) => { input.trick = [fx, fy]; } });   // left hold = charge (Zoom); left flick = trick (Skater flips)   // left hold in place = charge (Zoom)
bindStick($('stkR'), stickR, { onTap: jumpTap, onFlick: (fx, fy) => { input.attack = [fx, fy]; } });   // right flick = strike that way (Melee)
for (const p of [$('stkL'), $('stkR')]) p.addEventListener('pointerdown', () => ($('hint').style.opacity = 0));
const cv = renderer.domElement;
cv.addEventListener('pointerdown', e => { if (pickMode) pickAt(e.clientX, e.clientY); });

function readInput() {
  let ix = stickL.x, iy = stickL.y;          // screen: x right, y down
  if (keys.has('KeyA') || keys.has('ArrowLeft')) ix -= 1;
  if (keys.has('KeyD') || keys.has('ArrowRight')) ix += 1;
  if (keys.has('KeyW') || keys.has('ArrowUp')) iy -= 1;
  if (keys.has('KeyS') || keys.has('ArrowDown')) iy += 1;
  const len = Math.hypot(ix, iy); if (len > 1) { ix /= len; iy /= len; }
  // Camera looks along -forward; forward on the ground = (-sin yaw, -cos yaw).
  const fx = -Math.sin(yaw), fz = -Math.cos(yaw), rx = Math.cos(yaw), rz = -Math.sin(yaw);
  world.input.move = [rx * ix - fx * iy, rz * ix - fz * iy];
  if (input.jump) { world.input.jump = true; input.jump = false; }
  world.input.charge = !!input.charge;
  trigger();
  if (input.trick) { world.input.trick = input.trick; input.trick = null; }   // screen direction: [x right, y down]
  if (input.attack) {                        // screen flick → world direction, same mapping as the move stick; [0,0] = facing
    const [ax, ay] = input.attack, l = Math.hypot(ax, ay) || 1;
    world.input.attack = l > 1e-3 && (ax || ay) ? [(rx * ax - fx * ay) / l, (rz * ax - fz * ay) / l] : [0, 0];
    input.attack = null;
  }
}
// The TRIGGER (zap's padUp / WEAP): the right pad pushed UP past `at`, held `armT`, inside `arc` of straight up, is `fire`
// (a Blaster charges while it is held and fires on release); it stands down below `keep` (hysteresis, so a thumb rolling in
// as it lifts does not cancel the shot). A sideways drag is still the camera. Key G holds it on a keyboard.
const TRIG = { at: 0.78, keep: 0.48, armT: 90, arc: 1.05 };
let trigT = 0, trigOn = false;
function trigger() {
  const up = -stickR.y, mag = Math.hypot(stickR.x, stickR.y), off = Math.atan2(Math.abs(stickR.x), up);
  if (!stickR.down) { trigOn = false; trigT = 0; }
  else if (trigOn) { if (up < TRIG.keep) trigOn = false; }
  else if (mag >= TRIG.at && off <= TRIG.arc) { trigT ||= performance.now(); if (performance.now() - trigT >= TRIG.armT) trigOn = true; }
  else trigT = 0;
  world.input.fire = trigOn || keys.has('KeyG');
  world.input.aim = [-Math.sin(yaw), -Math.cos(yaw)];   // where the camera looks, on the ground
}
function turnCamera(dt) {
  const rx = stickR.x + ((keys.has('KeyE') ? 1 : 0) - (keys.has('KeyQ') ? 1 : 0));
  if (Math.abs(rx) > 0.05) yaw -= rx * YAW_RATE * dt;
}

// The collider view (weirdport's COLLIDERS key): every Solid as a wireframe box — turned boxes turned, ramps by their bounds —
// redrawn twice a second so walls that break and doors that open show it. Orange = walls, cyan = moving parts / chunks.
let colView = null, colT = 0;
const colMat = { wall: new THREE.LineBasicMaterial({ color: 0xff8a3d, depthTest: false, transparent: true, opacity: 0.8 }), part: new THREE.LineBasicMaterial({ color: 0x3de0ff, depthTest: false, transparent: true, opacity: 0.8 }) };
const colEdges = new THREE.EdgesGeometry(new THREE.BoxGeometry(1, 1, 1));
function drawColliders(dt) {
  if (!colView) return;
  if ((colT -= dt) > 0) return; colT = 0.5;
  colView.children.forEach(c => c.geometry.dispose()); colView.clear();
  const E = colEdges.attributes.position, out = { wall: [], part: [] };        // every box's 12 edges into ONE buffer per colour
  for (const so of world.solids || []) {
    const b = solidOutline(so), arr = out[so.entity?.chunk || so.entity?.part ? 'part' : 'wall'], C = Math.cos(b.yaw), S = Math.sin(b.yaw);
    for (let i = 0; i < E.count; i++) {
      const x = E.getX(i) * b.half[0] * 2, y = E.getY(i) * b.half[1] * 2, z = E.getZ(i) * b.half[2] * 2;
      arr.push(b.c[0] + C * x + S * z, b.c[1] + y, b.c[2] - S * x + C * z);
    }
  }
  for (const k of ['wall', 'part']) {
    if (!out[k].length) continue;
    const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(out[k], 3));
    const l = new THREE.LineSegments(g, colMat[k]); l.renderOrder = 999; l.frustumCulled = false; colView.add(l);   // sc:overlay
  }
}
$('cols').onclick = () => {
  if (colView) { colView.removeFromParent(); colView = null; $('cols').style.opacity = ''; return; }
  colView = new THREE.Group(); world.scene.add(colView); colT = 0; $('cols').style.opacity = 0.55;
};
// The cost of the frame, beside the collider view (the phone has no console): fps, draw calls, triangles, solids. Counted over
// every pass (post-processing renders more than once), so it is reset by hand each frame.
renderer.info.autoReset = false;
let statT = 0;
let frameStats = { draws: 0, tris: 0 }, particles = null, trails = null;
function showStats(dt) {
  const el = $('stats'), r = renderer.info.render; el.hidden = !colView;
  frameStats = { draws: r.calls, tris: r.triangles };            // last frame's totals, for the chip and the editor's LIVE badge
  if (colView && (statT -= dt) <= 0) {
    statT = 0.5; const over = overBudget(frameStats, { ...BUDGETS.web, ...(data.settings?.budget || {}) });
    el.textContent = `${fps.fps | 0} fps\n${r.calls} draws\n${(r.triangles / 1000).toFixed(0)}k tris\n${(world.solids || []).length} solids${over.length ? '\n⚠ ' + over.join('\n⚠ ') : ''}`;
    el.style.color = over.length ? '#ffb4a8' : '';
  }
  renderer.info.reset();
}
// HUD authored in the scene (HudLabel, HudBar): one element per id, stacked in its corner.
function hudCorner(c) {

  if (!box) {
    box = document.createElement('div'); box.id = 'hudc-' + c; box.className = 'hudCorner';
    const v = c.startsWith('top') ? 'top:calc(54px + env(safe-area-inset-top))' : c.startsWith('bottom') ? 'bottom:calc(150px + env(safe-area-inset-bottom))' : 'top:40%';
    const h = c.endsWith('left') ? 'left:calc(12px + env(safe-area-inset-left));align-items:flex-start' : c.endsWith('right') ? 'right:calc(12px + env(safe-area-inset-right));align-items:flex-end' : 'left:50%;transform:translateX(-50%);align-items:center';
    box.style.cssText = `position:fixed;${v};${h};display:flex;flex-direction:column;gap:6px;z-index:4;pointer-events:none;`;

}
function hudSet(h) {

  if (!el) { el = document.createElement('div'); el.id = 'hud-' + h.id; el.className = 'hudItem'; hudCorner(h.corner || 'top-right').append(el); }
  if (h.kind === 'bar') {
    el.style.cssText = `width:${h.width}px;font:700 12px system-ui,sans-serif;color:#fff;text-shadow:0 1px 3px #000a`;
    el.innerHTML = `${h.label ? `<div>${h.label.replace(/[<&]/g, '')}</div>` : ''}<div style="height:10px;border-radius:6px;background:#0007;overflow:hidden"><div style="height:100%;width:${(h.value * 100).toFixed(1)}%;background:${h.color}"></div></div>`;
  } else {
    el.textContent = h.text; el.style.cssText = `font:800 ${h.size}px/1.1 system-ui,sans-serif;color:${h.color};text-shadow:0 2px 6px #000a`;

}
// Speech bubbles (Reactions' "say"): a small label that follows the speaker's head for a few seconds. HUD only (sc:overlay-free).
const bubbles = new Map();
function say(id, text) {
  let b = bubbles.get(id);
  if (!b) { b = document.createElement('div'); b.className = 'bubble'; document.body.append(b); bubbles.set(id, b); }
  b.textContent = text; b.style.opacity = 1; b.until = performance.now() + 2500 + text.length * 40;
}
function placeBubbles() {
  const v = new THREE.Vector3();
  for (const [id, b] of bubbles) {
    const e = world?.getEntity(id); if (!e || performance.now() > b.until) { b.style.opacity = 0; continue; }
    e.object3d.getWorldPosition(v); v.y += 2.1; v.project(camera);
    b.style.transform = `translate(-50%, -100%) translate(${(v.x * 0.5 + 0.5) * innerWidth}px, ${(-v.y * 0.5 + 0.5) * innerHeight}px)`;

// ---- HUD
const hearts = (n, max) => max > 10 ? `❤ ${Math.ceil(n)} / ${max}` : '❤'.repeat(n) + '♡'.repeat(Math.max(0, max - n));   // a big health pool reads as a number, not a wall of hearts
function hud() {
  const h = player.behaviors.find(b => b.constructor.name === 'Health');
  const H = data.settings?.hud || {};             // a scene can drop the built-in row and author its own (HudLabel / HudBar)
  $('hearts').textContent = h && H.hearts !== false ? hearts(h.current, h.params.max) : '';
  const got = coinsTotal - [...world.entities.values()].filter(e => e.behaviors.some(b => b.constructor.name === 'Pickup' && !b.collected)).length;
  $('coins').textContent = `● ${got} / ${coinsTotal}`; $('coins').style.display = coinsTotal && H.coins !== false ? '' : 'none';   // no coins in this scene: no counter (and no instant win)
  if (!over && coinsTotal > 0 && got === coinsTotal) { sfx.play('win'); end('You got every coin! 🎉'); }
}
// the end screen — a Reactions 'end' can author it: a title, a line under it, the button's word, and a next scene to go to
function end(text, o = {}) {
  over = true; $('msgText').innerHTML = ''; $('msgText').append(text);
  if (o.sub) { const d = document.createElement('div'); d.style.cssText = 'font-size:16px;font-weight:600;opacity:.8;margin-top:6px'; d.textContent = o.sub; $('msgText').append(d); }
  $('again').textContent = o.button || (o.next ? 'Next' : 'Play again'); endNext = o.next || '';
  $('msg').style.display = 'flex';
}
let endNext = '';
// Saved progress (settings.save: { vars: ['score', …] }, or true for every variable): kept per scene on this device, written at
// every checkpoint and every few seconds; ?fresh in the address starts over.
const SAVE_KEY = 'sc.save:' + SCENE_URL.replace(/^\.\//, '');
let saveT = 0;
function saveSpec() { const s = data.settings?.save; return s ? (s === true ? { vars: null } : s) : null; }
function loadProgress() {
  const spec = saveSpec(); if (!spec) return null;
  if (new URLSearchParams(location.search).has('fresh')) { try { localStorage.removeItem(SAVE_KEY); } catch {} return null; }
  try { return JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); } catch { return null; }
}
function saveProgress() {
  const spec = saveSpec(); if (!spec || !world?.vars) return;
  const out = {}; for (const [k, v] of Object.entries(world.vars)) if (!spec.vars || spec.vars.includes(k) || k === 'checkpoint') out[k] = v;
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(out)); } catch {}
}

async function start() {
  world?.dispose(); post?.dispose();
  over = false; $('msg').style.display = 'none';
  world = new World(renderer, { tier: TIER });
  const scene = structuredClone(data);         // the authored data is never touched by play
  const saved = loadProgress();                 // settings.save: these variables and the last checkpoint come back next time
  if (saved) scene.settings = { ...(scene.settings || {}), variables: { ...(scene.settings?.variables || {}), ...saved } };
  await world.load(scene);
  for (const m of world.extensionErrors || []) showErr(m);   // an extension that did not load: say which and why
  world.instanceStatic();                     // repeated static props → one InstancedMesh per part (draw calls)
  window.__sc = { world, data, audio, renderer, camera, get particles() { return particles; }, get trails() { return trails; }, get live() { return liveStatus; } };
  player = world.getEntity('player');
  coinsTotal = [...world.entities.values()].filter(e => e.behaviors.some(b => b.constructor.name === 'Pickup')).length;
  audio.stop();
  particles?.dispose(); particles = createParticles(world.scene); particles.loadLibrary();   // + Colin's saved presets
  world.on('fx', req => particles.burst(req));                                 // Emitter → a burst of particles
  trails?.dispose(); trails = createTrails(world.scene);
  world.on('trail', s => trails.add(s));                                       // Trail → a ribbon sample
  world.on('audio', req => audio.play(req));                                   // AudioSource → a sound file
  world.on('audiostop', key => audio.stop(key));
  const music = data.settings?.music; if (music?.url || typeof music === 'string') audio.play({ url: music.url || music, loop: true, bus: 'music', key: 'music', volume: music.volume ?? 1 });
  world.on('gameover', () => { sfx.play('gameover'); end('Game over'); });
  world.on('health', () => { sfx.play('hurt'); hud(); });
  for (const [ev, snd] of [['jump', 'jump'], ['land', 'land'], ['pickup', 'coin'], ['stomp', 'stomp'], ['respawn', 'respawn']]) world.on(ev, () => sfx.play(snd));
  world.on('step', (_id, o) => sfx.play('step', { pitch: o?.pitch || 1 }));
  world.on('swing', () => sfx.play('jump', { pitch: 1.6 }));   // a quick whoosh until there's a real sound
  world.on('sound', name => sfx.play(name));                                   // Reactions → sound
  world.on('say', (id, text) => say(id, text));                                // Reactions → speech bubble
  world.on('hud', (text, secs) => hudMsg(text, secs));
  for (const el of document.querySelectorAll('.hudItem')) el.remove();
  world.on('hudset', h => hudSet(h));                                          // HudLabel / HudBar → screen
  world.emit('hudrefresh');                         // Reactions → on-screen message
  world.on('shake', (amount, secs) => { shake = { amp: amount, t: secs, dur: secs }; });
  world.on('zoom', (_id, power) => { fovKick = Math.max(fovKick, 14 * (power ?? 1)); });   // a Zoom dash widens the lens
  world.on('boost', () => { fovKick = Math.max(fovKick, 9); });                         // so does a skater's boost
  world.on('end', (text, o) => end(text, o));
  world.on('checkpoint', () => saveProgress());
  saveT = 0;
  world.on('loadScene', url => { location.search = `?scene=${encodeURIComponent(url)}`; });   // Footsteps varies the pitch (world.rng)
  post = (postGPU || createPost)(renderer, world.scene, camera, data.settings.post, TIER, world);
  world.scene.add(marker);                     // editor-selection marker (debug overlay, not part of the scene file)
  resize(); hud();
}
$('again').onclick = () => { if (endNext) location.href = `./play.html?scene=${encodeURIComponent(endNext)}`; else start(); };
// ---- pause: ⏸ (or the page going to the background) freezes game time (world.time.paused); animation stops too
function setPaused(on) {
  if (!world || (on && over)) return;
  world.time.paused = on; $('pauseMenu').style.display = on ? 'flex' : 'none';
}
$('pause').addEventListener('pointerdown', e => { e.stopPropagation(); setPaused(true); });
$('resume').onclick = () => setPaused(false);
$('restart').onclick = () => { setPaused(false); start(); };
$('pScenes').onclick = () => { $('scenes').hidden = false; };
$('pFresh').onclick = () => { location.href = `./play.html?scene=${encodeURIComponent(SCENE_URL)}&fresh=1`; };
$('pFresh').hidden = !data.settings?.save;
// settings.hint replaces the one-line controls hint; a 2D side view has no camera to turn
{ const h = data.settings?.hint ?? (data.settings?.camera2d ? 'Left stick: run · Tap the right stick: jump' : null); if (h != null) $('hint').textContent = h; }
// settings.title { text, sub, button }: a title card before the game runs (once per page load)
let titled = false;
function showTitle() {
  const t = data.settings?.title; if (!t || titled || !world) return;
  titled = true; $('titleText').textContent = t.text || ''; $('titleSub').textContent = t.sub || ''; $('titleGo').textContent = t.button || 'Play';
  $('title').hidden = false; world.time.paused = true;
}
$('titleGo').onclick = () => { $('title').hidden = true; if (world) world.time.paused = false; sfx.unlock(); audio.unlock(); };
document.addEventListener('visibilitychange', () => { if (document.hidden) setPaused(true); });
addEventListener('keydown', e => { if (e.code === 'Escape' || e.code === 'KeyP') setPaused(!world?.time.paused); });

// ---- camera: behind and above the player, smoothed; pulls in when a solid is in the way
const focus = new THREE.Vector3(), camPos = new THREE.Vector3();
const CAM_DIST = 7;
let camDist = CAM_DIST;
function updateCamera(dt, snap) {
  const rig = pickRig(world), R = rig?.params;                // a CameraRig in the scene, or the built-in follow cam
  if (rig !== lastRig) { snap = true; lastRig = rig; }
  const tgt = (R && world.getEntity(R.target)) || player, p = tgt.object3d.position;
  focus.set(p.x, p.y + (R ? R.height : 1.3), p.z);
  const C2 = R ? null : data.settings?.camera2d;            // 2D (settings.camera2d { view: side|top, size, fov, height, lag }): a long, narrow lens
  const baseFov = R ? R.fov : C2 ? (C2.fov ?? 20) : 60;
  if (C2) {
    // side: the lens on +z looking straight down -z (screen right = +x); top: straight down (screen up = -z). `size` metres of
    // the world fill the screen height at any fov; a narrow fov from far away reads flat, close to orthographic.
    const top = C2.view === 'top', D = (C2.size ?? 14) / 2 / Math.tan(baseFov * Math.PI / 360);

  } else if (R?.mode === 'fixed' || R?.mode === 'rail') {            // from the rig's spot (fixed) or the nearest point of its path (rail), looking at the target
    const o = rig.entity.object3d.position, q = R.mode === 'rail' ? rig.railPoint([p.x, p.y, p.z]) : null;
    if (q) camPos.set(q[0], q[1], q[2]); else camPos.set(o.x, o.y, o.z);
    camera.position.lerp(camPos, snap ? 1 : 1 - Math.exp(-dt * R.lag)); camera.lookAt(focus);
    const dx = focus.x - camera.position.x, dz = focus.z - camera.position.z; if (Math.hypot(dx, dz) > 0.2) yaw = Math.atan2(-dx, -dz);   // the sticks steer by the camera that is showing
  } else {
    const pt = R ? R.pitch * Math.PI / 180 : pitch, D = R ? R.distance : CAM_DIST;
    const dir = [Math.sin(yaw) * Math.cos(pt), Math.sin(pt), Math.cos(yaw) * Math.cos(pt)];

    const allowed = clipCamera([focus.x, focus.y, focus.z], dir, D, boxes, { floorY: player.behaviors.find(b => b.constructor.name === 'PlayerController')?.params.groundY ?? 0 });
    // Snap in fast when blocked (never look through a wall), ease back out slowly.
    camDist = snap || allowed < camDist ? allowed : camDist + (allowed - camDist) * (1 - Math.exp(-dt * 3));

    shake.t -= dt; const k = shake.amp * Math.max(0, shake.t / shake.dur), r = () => (Math.random() * 2 - 1) * k;

}
let shake = { amp: 0, t: 0, dur: 1 }, fovKick = 0, lastRig = null;
function hudMsg(text, secs = 2) {
  let el = document.getElementById('hudMsg');
  if (!el) { el = document.createElement('div'); el.id = 'hudMsg'; document.body.append(el); }
  el.textContent = text; el.style.opacity = 1;
  clearTimeout(hudMsg.t); hudMsg.t = setTimeout(() => { el.style.opacity = 0; }, secs * 1000);
}

function resize() { renderer.setSize(innerWidth, innerHeight); post?.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', resize);
// lock page zoom (double-tap / pinch), iOS included
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault());
let lastTouch = 0;
document.addEventListener('touchend', e => { const n = Date.now(); if (n - lastTouch < 300) e.preventDefault(); lastTouch = n; }, { passive: false });
document.addEventListener('touchmove', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });

// ---- selection marker: shows what's selected in the editor (live link), bobbing above it
const marker = new THREE.Mesh(new THREE.ConeGeometry(0.22, 0.45, 12), new THREE.MeshBasicMaterial({ color: 0x3ddc84, depthTest: false, transparent: true, opacity: 0.9 }));   // sc:overlay
marker.rotation.x = Math.PI; marker.renderOrder = 999; marker.visible = false;
const markerBox = new THREE.Box3();
let selectedId = null;
function updateMarker(t) {
  const ent = selectedId && world.getEntity(selectedId);
  marker.visible = !!ent;
  if (!ent) return;
  markerBox.setFromObject(ent.object3d);
  const top = markerBox.isEmpty() ? ent.object3d.position.y : markerBox.max.y;
  marker.position.set(ent.object3d.position.x, top + 0.5 + Math.sin(t * 4) * 0.08, ent.object3d.position.z);
}

// ---- pick mode (live link): tap objects in the running game to select them in the editor
let pickMode = false;
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
const entityIdOf = o => { while (o) { if (o.userData.entityId) return o.userData.entityId; o = o.parent; } return null; };
$('pick').addEventListener('pointerdown', e => {
  e.stopPropagation(); pickMode = !pickMode;
  $('pick').classList.toggle('on', pickMode);
  document.body.classList.toggle('picking', pickMode);
});
function pickAt(x, y) {
  ptr.set((x / innerWidth) * 2 - 1, -(y / innerHeight) * 2 + 1);
  ray.setFromCamera(ptr, camera);
  const hit = ray.intersectObjects(world.scene.children, true).find(h => h.object !== marker && h.object.visible && entityIdOf(h.object));
  selectedId = hit ? entityIdOf(hit.object) : null;
  if (liveWs?.readyState === 1) liveWs.send(JSON.stringify({ type: 'pick', url: SCENE_URL, id: selectedId }));
}

// ---- live link: edits from the editor (served by `npm run dev`) patch this running game.
let liveStatus = '', liveWs = null;
{
  const connect = () => {
    let ws; try { ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/live`); } catch { return; }
    let queue = Promise.resolve();                       // handle edits one at a time (a rebuild takes a moment)
    ws.onmessage = ev => { queue = queue.then(() => handle(ev)).catch(e => showErr(e.message)); };
    const handle = async ev => {
      let msg; try { msg = JSON.parse(ev.data); } catch { return; }
      if (msg.type === 'select' && sameScene(msg.url, SCENE_URL)) { selectedId = msg.id || null; return; }
      if (msg.type !== 'scene' || !msg.data || !SCENE_URL.endsWith(msg.url.replace(/^\.\//, ''))) return;
      const result = world ? applyScene(world, data, msg.data) : 'rebuild';
      data = msg.data;
      if (result === 'rebuild') await start(); else if (result !== 'none') world.instanceStatic();   // a moved tree moves its instance too
      liveStatus = result;
      if (result !== 'none') { const b = $('liveBadge'); b.classList.add('flash'); setTimeout(() => b.classList.remove('flash'), 300); }
    };
    ws.onopen = () => { $('liveBadge').hidden = false; $('pick').hidden = false; liveWs = ws; };
    ws.onclose = () => { $('liveBadge').hidden = true; $('pick').hidden = true; setTimeout(connect, 3000); };
  };
  if (location.protocol.startsWith('http')) connect();
}

await start();
showTitle();
updateCamera(0, true);
const clock = new THREE.Clock(), fps = createFpsMeter(1);
let reportIn = 0;
renderer.setAnimationLoop(() => {
  const raw = clock.getDelta(), dt = Math.min(raw, 0.05);
  fps.tick(raw);
  // report state to the editor twice a second (FPS, new errors, where the selected object really is)
  if ((reportIn -= raw) <= 0 && liveWs?.readyState === 1) {
    reportIn = 0.5;
    liveWs.send(JSON.stringify(buildState(world, { url: SCENE_URL, fps: fps.fps, errors: window.__errQueue.splice(0), selectedId, ...frameStats })));
  }
  updateMarker(clock.elapsedTime);
  if (!over && !world.time.paused) { readInput(); turnCamera(dt); world.update(dt); hud(); }
  world.animate(dt);
  updateCamera(dt);
  world.view = { pos: camera.position.toArray() };   // behaviors that follow the lens (Parallax) read it next frame
  world.followFocus(focus);
  placeBubbles();
  drawColliders(dt);
  showStats(dt);
  if (saveSpec() && (saveT += dt) > 5) { saveT = 0; saveProgress(); }
  particles?.update(dt, camera, renderer);
  trails?.update(dt, camera);
  { const f = new THREE.Vector3(); camera.getWorldDirection(f); audio.listen(camera.position.toArray(), f.toArray());
    audio.update(id => { const o = world.getEntity(id)?.object3d; return o ? o.getWorldPosition(new THREE.Vector3()).toArray() : null; }); }
  if (post) post.render(); else renderer.render(world.scene, camera);
});
</script>
